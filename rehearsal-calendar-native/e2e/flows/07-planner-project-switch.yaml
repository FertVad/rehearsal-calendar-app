# Switching the planner to another project selects that project's people, not
# the ones the previous project had (DP01, cause fix 8).
appId: ${APP_ID}
name: Planner follows the project
tags:
  - planner
  - projects
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
- tapOn: "Planner, tab.*"
- tapOn:
    id: planner-project
- tapOn: "Hamlet"
- extendedWaitUntil:
    visible: "4 of 4 selected"
    timeout: 15000
# The Seagull has two people. Its own roster, all of it, is what is selected.
- tapOn:
    id: planner-project
- tapOn: "The Seagull"
- extendedWaitUntil:
    visible: "2 of 2 selected"
    timeout: 15000
- assertNotVisible: "4 of 2 selected"
# And back: Hamlet's four again, not The Seagull's two.
- tapOn:
    id: planner-project
- tapOn: "Hamlet"
- extendedWaitUntil:
    visible: "4 of 4 selected"
    timeout: 15000
- assertNotVisible: "2 of 4 selected"
- takeScreenshot: 07-planner-project-switch
