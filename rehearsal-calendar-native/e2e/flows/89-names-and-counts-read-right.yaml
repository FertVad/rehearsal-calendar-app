# Names and numbers in a sentence, as a native speaker writes it (T-250).
# Words the app builds around what it does not choose: a person's name, as
# the account has it, and a count.
# - The rehearsal form's warning guessed a gender: «Тихон Кабанов занят(а) в
#   это время», "Тихон Кабанов está ocupado/a a esa hora". Now «В это время не
#   может: Тихон Кабанов», "Тихон Кабанов no puede a esa hora".
# - A member's dialogs put the name in an oblique case the app cannot make:
#   «Вы уверены, что хотите удалить Тихон Кабанов из проекта?», «…назначить
#   Тихон Кабанов администратором…». Now the name is the subject: «Тихон
#   Кабанов больше не будет участником проекта.», «Тихон Кабанов станет
#   администратором проекта.»
# - Under «Аккаунт удалён» the projects deleted with it were still to come,
#   and the count is Russian's second form: «Будут удалены 2 проекта, где вы
#   единственный администратор.» Now «Также удалены 2 проекта, где вы были
#   единственным администратором.»
#
# Kabanikha's account speaks Spanish. She plans a rehearsal tomorrow at 10:00
# over Tikhon's busy hours, switches to Russian, opens his row in «Гроза»
# twice and cancels, plans the same again, and deletes her account: «Гроза»
# and «Бесприданница», which only she runs, go with it. Nothing else is saved.
# Each text is checked where it shows and the flow goes on, so a run on the
# old words names every one of them; it fails at the end if any was wrong.
#
# And as the native speakers of T-256 read them: an alert is left with
# «Отменить», as iOS's own, not «Отмена»; a clash in the schedule is a
# «Накладка в расписании», as the theatre says it, not «Конфликт расписания».
# In Spanish her row of a rehearsal she is not on says «No estás en este
# ensayo» (Tikhon's «Сцена с Тихоном», in two days), and her badge in «Гроза»
# is «Admin principal», the first admin's, not the man's «Propietario». The
# rest of the screens she passes, as the native speakers wrote them (T-256):
# - Spanish: its seen count «Lo han visto», not «Vistos»; deleting it, asked
#   and left, «1 participante recibirá una notificación»; the note under her
#   hour from her phone's calendar «cuando buscan un horario»; a day gone's
#   «Eliminar las marcas de este día», whole, and its alert «¿Eliminar las
#   marcas?», whole and left; the planner's «No disponible:
#   Тихон Кабанов», not «Ocupados», and singular for one (T-258).
# - German: Tikhon's action «Adminrechte geben», whole, and its alert, left;
#   deleting «Сцена с Тихоном»
#   asks «„…“ (…) löschen?» with «1 Teilnehmer wird benachrichtigt».
# - Russian: deleting it, «Уведомление получит 1 участник».
# - Spanish and Russian ask with the date in brackets, as German does:
#   «¿Eliminar «…» (…)?», «Удалить «…» (…)?» (T-261).
appId: ${APP_ID}
name: Names and counts read right
tags:
  - language
  - planner
  - rehearsals
  - projects
  - participants
  - profile
---
- evalScript: ${output.wrong = ''}
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${KABANIKHA_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000

# Spanish: her row of «Сцена с Тихоном», Tikhon's alone, says she is not on it
# (T-256): "No estás en este ensayo", not "No estás en el reparto".
- extendedWaitUntil:
    visible: "(?s).*Сцена с Тихоном.*Гроза.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 89-not-on-it-es
- runFlow:
    when:
      notVisible: "(?s).*Сцена с Тихоном.*Гроза.*No estás en este ensayo.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: No estás en este ensayo, not en el reparto | '}"
# Its count of who has seen it, as VoiceOver reads it: "Lo han visto", not
# "Vistos" (T-256).
- runFlow:
    when:
      notVisible:
        id: seen-count
        text: "Lo han visto: .*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: Lo han visto, not Vistos | '}"
# Deleting it, asked and left: the count of who will be told comes first and
# takes its noun's number, "1 participante recibirá una notificación", not
# "Los participantes (1) recibirán un aviso" (T-256).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "(?s).*Сцена с Тихоном.*Гроза.*"
      SEE: "Тихон Кабанов.*"
      WAIT_MS: "15000"
- scrollUntilVisible:
    element:
      id: rehearsal-details-delete
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: rehearsal-details-delete
      SEE: "¿Eliminar «Сцена с Тихоном»(,| \\().*\\?"
      WAIT_MS: "10000"
- takeScreenshot: 89-delete-es
# The date in brackets: its own commas ran into the title's (T-261).
- runFlow:
    when:
      notVisible: "¿Eliminar «Сцена с Тихоном» \\(.*\\)\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: ¿Eliminar «…» (fecha)? | '}"
- runFlow:
    when:
      notVisible: "1 participante recibirá una notificación"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: 1 participante recibirá una notificación, not Los participantes (1) | '}"
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible: "¿Eliminar «Сцена с Тихоном»(,| \\().*\\?"
    timeout: 10000
- tapOn: "Cerrar"
- extendedWaitUntil:
    notVisible:
      id: rehearsal-details-delete
    timeout: 10000

# Spanish: her hour from her phone's calendar on MORNING_DAY, the note under it
# "cuando buscan un horario", not "al buscar un hueco" (T-256).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-create
      SEE: "Marcar horas ocupadas"
      WAIT_MS: "5000"
- tapOn: "Marcar horas ocupadas"
- scrollUntilVisible:
    element:
      id: day-${MORNING_DAY}
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${MORNING_DAY}
- tapOn:
    id: day-${MORNING_DAY}
- extendedWaitUntil:
    visible: "Los demás ven estas horas .*"
    timeout: 10000
- runFlow:
    when:
      notVisible: "Los demás ven estas horas cuando buscan un horario\\..*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: cuando buscan un horario, not al buscar un hueco | '}"
- tapOn:
    id: availability-deselect
# A day gone: its button says "Eliminar las marcas de este día", not "datos de
# esta fecha" (T-256), and is whole. Only from the 2nd of a month: the editor
# begins with this month, so on the 1st it has no day gone.
- runFlow:
    when:
      true: ${YESTERDAY_DAY.slice(0, 7) == TODAY_DAY.slice(0, 7)}
    commands:
      - scrollUntilVisible:
          element:
            id: day-${YESTERDAY_DAY}
          direction: UP
          centerElement: true
          timeout: 30000
      - runFlow:
          file: ../subflows/day-in-reach.yaml
          env:
            DAY: ${YESTERDAY_DAY}
      - tapOn:
          id: day-${YESTERDAY_DAY}
      - extendedWaitUntil:
          visible: ".*Eliminar (las marcas de este día|datos de esta fecha).*"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: 89-day-gone-es
      - runFlow:
          when:
            notVisible: ".*Eliminar las marcas de este día.*"
          commands:
            - evalScript: "${output.wrong = output.wrong + 'es: Eliminar las marcas de este día, not datos de esta fecha | '}"
      - runScript:
          file: ../scripts/no-ellipsis.js
          env:
            MAIL_URL: ${MAIL_URL}
            SHOT: 89-day-gone-es
            LEFT: "0"
            RIGHT: "1"
            TOP: "0.07"
            BOTTOM: "0.95"
      # Its alert asks "¿Eliminar las marcas?", not "¿Eliminar datos?", and
      # says the day is gone (T-256); whole, and left.
      - tapOn: ".*Eliminar (las marcas de este día|datos de esta fecha).*"
      - extendedWaitUntil:
          visible: "¿Eliminar (las marcas|datos)\\?"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: 89-delete-marks-alert-es
      - runFlow:
          when:
            notVisible: "¿Eliminar las marcas\\?"
          commands:
            - evalScript: "${output.wrong = output.wrong + 'es: ¿Eliminar las marcas?, not ¿Eliminar datos? | '}"
      - runFlow:
          when:
            notVisible: "Se eliminarán tus marcas de este día, que ya pasó\\."
          commands:
            - evalScript: "${output.wrong = output.wrong + 'es: the delete alert, its message | '}"
      - runScript:
          file: ../scripts/no-ellipsis.js
          env:
            MAIL_URL: ${MAIL_URL}
            SHOT: 89-delete-marks-alert-es
            LEFT: "0"
            RIGHT: "1"
            TOP: "0.07"
            BOTTOM: "0.95"
            RECORD: cut
      - evalScript: "${output.wrong = output.wrong + (output.cut ? 'es: ' + output.cut + ' | ' : '')}"
      # The alert's, not the editor's "Cancelar" above it.
      - tapOn:
          text: "Cancelar"
          below: "¿Eliminar (las marcas|datos)\\?"
      - extendedWaitUntil:
          notVisible: "¿Eliminar (las marcas|datos)\\?"
          timeout: 10000
      - tapOn:
          id: availability-deselect
# Nothing changed: the editor closes unasked.
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000

# Spanish: her own row in «Гроза» is its first admin's, "Admin principal",
# not "Propietario" (T-256), and the badge is whole.
- tapOn:
    id: tab-projects
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Гроза.*"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: project-card
    text: ".*Гроза.*"
- extendedWaitUntil:
    visible: ".*Compartir el enlace"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Марфа Кабанова.*"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 89-owner-badge-es
# The row is one button, its name and badge read joined.
- runFlow:
    when:
      notVisible: "(?s).*Марфа Кабанова.*Admin principal.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: Admin principal, not Propietario | '}"
# Back to the list, where the Russian part opens «Гроза» again.
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Гроза.*"
    timeout: 10000
- tapOn:
    id: tab-calendar

# Spanish: the planner's slot tomorrow at 10:00, Tikhon busy in it.
- tapOn: "Planner, tab.*"
- extendedWaitUntil:
    visible:
      id: planner-project
    timeout: 15000
- tapOn:
    id: planner-project
- tapOn: "Гроза"
- scrollUntilVisible:
    element:
      id: planner-add-${TOMORROW_DAY}-10:00
    direction: DOWN
    centerElement: true
    timeout: 60000
- waitForAnimationToEnd
# Who cannot come, "No disponible" (T-256), singular for Tikhon alone (T-258).
- runFlow:
    when:
      notVisible: "No disponible: Тихон Кабанов"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: No disponible, one busy, not Ocupados nor No disponibles | '}"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: planner-add-${TOMORROW_DAY}-10:00
      SEE: "Añadir ensayo"
      WAIT_MS: "10000"
# His busy hours are in once the form names him busy.
- extendedWaitUntil:
    visible:
      id: participants-conflict
    timeout: 15000
- scrollUntilVisible:
    element:
      id: rehearsal-submit
    direction: DOWN
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: rehearsal-submit
      SEE: ".*Conflicto de horario"
      WAIT_MS: "10000"
- takeScreenshot: 89-conflict-es
- runFlow:
    when:
      notVisible: "Тихон Кабанов no puede a esa hora[\\s\\S]*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the conflict | '}"
- tapOn:
    text: "Cancelar"
    below: "Crear de todos modos"
- extendedWaitUntil:
    notVisible: ".*Conflicto de horario"
    timeout: 10000
- tapOn:
    id: header-cancel
- runFlow:
    when:
      visible: "No guardar"
    commands:
      - tapOn: "No guardar"
- extendedWaitUntil:
    notVisible:
      id: header-cancel
    timeout: 10000

# German, chosen in the profile (T-256): Tikhon's action is "Adminrechte
# geben", not "Administratorrechte geben", whole in the sheet, and its alert
# asks "Adminrechte geben?"; left, so «Гроза» is hers alone to run. And deleting «Сцена с Тихоном» asks with the verb last, „…“ (…)
# löschen?, and "1 Teilnehmer wird benachrichtigt".
- tapOn:
    id: tab-profile
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "Deutsch"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-de
      SEE: "Profil, tab.*"
      WAIT_MS: "10000"
- tapOn:
    id: tab-projects
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Гроза.*"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: project-card
    text: ".*Гроза.*"
- extendedWaitUntil:
    visible: ".*Link teilen"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Тихон Кабанов.*"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Тихон Кабанов.*"
      SEE: "Mitglied verwalten"
      WAIT_MS: "10000"
- waitForAnimationToEnd
- takeScreenshot: 89-make-admin-item-de
- runFlow:
    when:
      notVisible: ".*Adminrechte geben"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Adminrechte geben, not Administratorrechte | '}"
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 89-make-admin-item-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- tapOn: ".*(Adminrechte|Administratorrechte) geben"
- extendedWaitUntil:
    visible: "(Adminrechte|Administratorrechte) geben\\?"
    timeout: 10000
# Waited for whichever it says; its title is then read whole (review 2 of
# T-256: the old "Administratorrechte geben?" went through).
- runFlow:
    when:
      notVisible: "Adminrechte geben\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Adminrechte geben?, its title | '}"
- runFlow:
    when:
      notVisible: "Möchtest du Тихон Кабанов wirklich Adminrechte für das Projekt geben\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Adminrechte geben?, its message | '}"
- tapOn: "Abbrechen"
- extendedWaitUntil:
    notVisible: "(Adminrechte|Administratorrechte) geben\\?"
    timeout: 10000
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Гроза.*"
    timeout: 10000
# «Сцена с Тихоном» from the calendar.
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible: "(?s).*Сцена с Тихоном.*Гроза.*"
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "(?s).*Сцена с Тихоном.*Гроза.*"
      SEE: "Тихон Кабанов.*"
      WAIT_MS: "15000"
- scrollUntilVisible:
    element:
      id: rehearsal-details-delete
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: rehearsal-details-delete
      SEE: "„Сцена с Тихоном“.*löschen.*\\?"
      WAIT_MS: "10000"
- takeScreenshot: 89-delete-de
- runFlow:
    when:
      notVisible: "„Сцена с Тихоном“ \\(.*\\) löschen\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: „…“ (…) löschen?, the verb last | '}"
- runFlow:
    when:
      notVisible: "1 Teilnehmer wird benachrichtigt"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: 1 Teilnehmer wird benachrichtigt, not Teilnehmer (1) | '}"
- tapOn: "Abbrechen"
- extendedWaitUntil:
    notVisible: "„Сцена с Тихоном“.*löschen.*\\?"
    timeout: 10000
- tapOn: "Schließen"
- extendedWaitUntil:
    notVisible:
      id: rehearsal-details-delete
    timeout: 10000

# Russian, chosen in the profile.
