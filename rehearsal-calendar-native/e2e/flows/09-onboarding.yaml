# A new member goes through onboarding to the end without giving the app
# anything the system asks for, lands on the calendar, and is not shown
# onboarding again — not when the app is opened again, not on a fresh install
# (T-003). Nina Newcomer has not been through it; no other flow signs her in.
#
# It found the end going to the inbox: onboarding and the app shared one
# navigation container, and the app stack took over onboarding's state, whose
# last step but one, Notifications, is also the name of the app's inbox. Each
# stage now has a container of its own (navigation/index.tsx, stageState.test).
#
# Maestro's launchApp grants every permission unless told otherwise, so the
# app is launched with them unset: the calendar step then has to ask, and iOS
# asks, and she refuses. The notifications step is passed by "Not now" — a
# simulator would not show that prompt anyway (docs/e2e.md, push).
#
# T-022: the greeting is one line, "Welcome, Nina!" (it was "Welcome!",
# "Nina!" and "Rehearsly" on three). The calendar step is two sentences and
# the card: the privacy box is gone, and "Set up later" is a button that goes
# on, with the Profile path under it. "Not now" ends the notifications step's
# content, above the bar: under Back and Turn on it lifted the bar on that
# step alone. The week-start step is gone; the last step says what is where,
# and the week starts as the phone's region has it — Sunday on this en_US
# simulator, where the step's default was Monday.
#
# T-406: where the week-start step was, right after the greeting, the app asks
# outright whether to mark all weekends busy, naming the days of the country of
# her profile's zone (WEEKEND_DAYS_EN_LABEL), and says where that is changed
# later, in the Profile's words. She answers no, and the profile's switch is
# off at the end.
#
# T-412: one design on every step. "‹ Back" at the top left, across from
# "Skip" (none on the greeting); the step's answers together at the bottom,
# the purple one over the grey one; no "Next". The calendar step is "Calendar
# Sync", "Grant Access" over "Set up later" when the app has no access. The
# texts are in lines by their sense, as the native speakers broke them, and
# typeset: "a" glued to its word, no line begun by a dash (no-break spaces).
appId: ${APP_ID}
name: Onboarding to the end, nothing granted
tags:
  - onboarding
  - auth
  - calendar
  - profile
# iOS's calendar prompt outlives the app: left up by a failure here, it stood
# over the sign-in screen of the next two flows (T-299).
onFlowComplete:
  - runFlow:
      file: ../subflows/no-calendar-prompt-left.yaml
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${NEWCOMER_EMAIL}
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
# One line, the name in it. ("Rehearsly" is not asked after: the application
# element itself is labelled with it.)
- assertVisible: "Welcome, Nina!"
- assertNotVisible: "Nina!"
- assertNotVisible:
    id: onboarding-back
- assertVisible: "Plan rehearsals, manage schedules,\nand sync calendars in one place\\."
- takeScreenshot: 09-onboarding-welcome
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Get Started"
      SEE: "Mark all weekends\n\\(${WEEKEND_DAYS_EN_LABEL}\\)\nas busy\\?"
      WAIT_MS: 10000
# Weekends: asked outright, with where to change it later (T-406), the path
# whole on its line — no-break spaces in it — and in the native speaker's
# words (T-408).
- assertVisible: "You can turn this on or off later in Profile\u00a0→\u00a0Mark\u00a0Weekends\u00a0as\u00a0Busy"
- assertVisible: "When someone looks for a\u00a0rehearsal time,\nthey will see you as busy on those days\\.\nYou can still change any individual day\nin Availability\\."
# The question in its three lines, never smaller than 26 pt (T-412): three
# lines are about 90 to 120 high from 26 to 32 pt; squeezed to one line
# (T-408) it was 21.
- assertVisible:
    id: onboarding-title
    height: 105
    tolerance: 17
# "‹ Back" at the top, the answers at the bottom, "Yes" over "No" (T-412).
- assertVisible:
    id: onboarding-back
    text: "Back"
    above:
      id: onboarding-title
- assertVisible:
    text: "No, Leave Them Free"
    below:
      text: "Yes, Mark Them"
- takeScreenshot: 09-onboarding-weekends
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 09-onboarding-weekends
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "No, Leave Them Free"
      SEE: "Calendar Sync"
      WAIT_MS: 10000
# Calendar: both ways of the sync and the card; the privacy said once. The
# path whole, no line begun by "→" (T-412). Access asked at the bottom, over
# "Set up later"; no "Next".
- assertVisible: "(?s)Rehearsals appear in your calendar automatically,.*not what you’re doing\\."
- assertNotVisible: ".*We read only the busy time slots.*"
- assertVisible: "You can do it later in Profile\u00a0→\u00a0Calendar\u00a0Sync"
- assertVisible:
    text: "Set up later"
    below:
      text: "Grant Access"
- assertNotVisible: "Next"
# The app has no access, asks, and is refused.
- tapOn: "Grant Access"
- extendedWaitUntil:
    visible: "Don’t Allow|Don't Allow"
    timeout: 10000
- takeScreenshot: 09-onboarding-calendar-prompt
# The app says it has none and stays on the step; she sets it up later. The
# simulator lost this tap once (T-299, backboardd), so it goes as every tap
# whose result the flow waits for.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Don’t Allow|Don't Allow"
      SEE: "OK"
      WAIT_MS: 10000
- tapOn: "OK"
- assertVisible: "Grant Access"
- takeScreenshot: 09-onboarding-calendar
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Set up later"
      SEE: "Not now"
      WAIT_MS: 10000
# Notifications: not now. Its examples are what a notification says; they were
# the form's "Add Rehearsal" and "Save Changes", framed like buttons (T-011).
# They read as push titles do in English, "Rehearsal Time Changed" (T-256);
# Maestro does not tell the case, proofreading.test.ts does.
- assertVisible: "Notifications"
- assertVisible: "You Were Added to a\u00a0Rehearsal"
- assertVisible: "Rehearsal Time Changed"
- assertNotVisible: "Add Rehearsal"
- assertNotVisible: "Save Changes"
- assertVisible: "A\u00a0new rehearsal, a\u00a0new time, or a\u00a0cancellation\u00a0—\nyou’ll know right away\\."
# Both answers at the bottom, "Turn On" over "Not now" (T-412).
- assertVisible:
    text: "Not now"
    below:
      text: "Turn On"
- takeScreenshot: 09-onboarding-notifications
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Not now"
      SEE: "What.s where"
      WAIT_MS: 10000
# What is where, in the labels the app shows there; no week-start step.
# Joined "Invited?", not "With a code: … “Join with a Code”", the code twice
# (T-261).
- assertVisible: "“\\+”\u00a0→ “Create Project”\\. Invited\\? “Projects”\u00a0→ “Join with a\u00a0Code”"
- assertNotVisible: ".*With a code:.*"
- assertVisible: ".*Create Rehearsal.*admin.*"
- assertVisible: ".*Mark Busy.*"
- assertVisible: ".*Smart Planner.*under the calendar.*"
- assertNotVisible: "Week Start Day"
- takeScreenshot: 09-onboarding-what-where
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Get Started"
      SEE: "Today"
      WAIT_MS: 15000
# The calendar, and onboarding gone.
- assertVisible:
    id: calendar-today
- assertNotVisible:
    id: onboarding-skip
- takeScreenshot: 09-onboarding-done
# The week starts as the phone's region starts it: Sunday in en_US.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Start Week On.*"
      WAIT_MS: 10000
- assertVisible: ".*Sunday.*"
- takeScreenshot: 09-onboarding-week-start
# Her answer about the weekends is the profile's switch, under the week's
# first day: off (T-406).
- scrollUntilVisible:
    element:
      id: profile-weekends-busy
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      id: profile-weekends-busy
      checked: false
      enabled: true
    timeout: 10000
- assertVisible:
    id: profile-weekends-days
    text: "Your weekend: ${WEEKEND_DAYS_EN_LABEL}"
# Opened again, still signed in: straight to the calendar.
- stopApp
- launchApp:
    permissions:
      all: unset
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 30000
- assertNotVisible:
    id: onboarding-skip
- assertNotVisible: "Welcome.*"
# A fresh install, signed in again: the server kept it.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${NEWCOMER_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 30000
- assertNotVisible:
    id: onboarding-skip
- assertNotVisible: "Welcome.*"
- takeScreenshot: 09-onboarding-not-again
