# The form does not save before it knows who is busy that day (cause fix 12:
# DF05). Charlotta opens the rehearsal form for her project; the availability
# of the day shown is on its way, held back. The old form checked conflicts
# against nothing — "nobody is busy" — and created the rehearsal; now it says
# under the participants that the availability is still being checked, and
# offers no Create until it is in: a tap on it brings no alert (T-018; it was
# an alert on Create). Then the answer comes, the note goes and Create is
# offered.
# She has the keyboard up from typing the location: the button stays over the
# keyboard. It was at the end of the form, and the keyboard covered it (T-009).
# Closing the form with the location typed asks first, and "Don't Save" closes
# it; the close button closed it at once and the typing was gone. Opened again
# and left as it came, it closes without asking (T-013).
appId: ${APP_ID}
name: Save before the availability is in
tags:
  - rehearsals
  - availability
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${CHARLOTTA_EMAIL}
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: GET
      PATH: "/members/availability$"
      # Held through the typing, longer than the nine seconds of a plain hold.
      OPEN: "1"
- tapOn:
    id: tab-create
- tapOn: "Create Rehearsal"
- extendedWaitUntil:
    visible:
      id: rehearsal-project
      text: ".*Charlotta Tricks.*"
    timeout: 15000
# The people are in; the day's availability is not.
- extendedWaitUntil:
    visible:
      id: participants-row
      text: "Participants, 1 of 1"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: rehearsal-location
    direction: DOWN
    centerElement: true
- tapOn:
    id: rehearsal-location
- inputText: "Rehearsal room"
- takeScreenshot: 20-create-over-keyboard
- assertVisible:
    id: rehearsal-participants-note
    text: ".*availability for this day is still being checked.*"
- assertVisible:
    id: rehearsal-submit
    enabled: false
- tapOn:
    id: rehearsal-submit
- waitForAnimationToEnd
- assertNotVisible: "Error"
- assertNotVisible: "Rehearsal created"
- takeScreenshot: 20-save-waits-for-availability
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
- extendedWaitUntil:
    notVisible:
      id: rehearsal-participants-note
    timeout: 10000
- assertVisible:
    id: rehearsal-submit
    enabled: true
- takeScreenshot: 20-create-offered-over-keyboard
# Scrolled down to the location, the form has its close button above the
# sheet's top edge: clipped, but on the screen, so a tap on it goes to the
# status bar. The form is scrolled back to its top first.
- swipe:
    start: "50%, 35%"
    end: "50%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: rehearsal-project
    timeout: 5000
- tapOn:
    id: rehearsal-close
- extendedWaitUntil:
    visible: "Don't Save"
    timeout: 5000
- takeScreenshot: 20-close-asks
- tapOn: "Don't Save"
- extendedWaitUntil:
    notVisible:
      id: rehearsal-close
    timeout: 10000
- assertNotVisible: "Rehearsal created"
- tapOn:
    id: tab-create
- tapOn: "Create Rehearsal"
- extendedWaitUntil:
    visible:
      id: participants-row
      text: "Participants, 1 of 1"
    timeout: 15000
- tapOn:
    id: rehearsal-close
- extendedWaitUntil:
    notVisible:
      id: rehearsal-close
    timeout: 10000
- assertNotVisible: "Don't Save"
