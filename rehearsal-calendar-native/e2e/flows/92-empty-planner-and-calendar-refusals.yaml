# What the planner and the sync say when there is nothing, or the phone's
# calendar will not do as asked — in the native speakers' words (T-256):
# - Russian, the empty planner: «Здесь появляются часы, когда свободны все
#   участники. Для этого им нужно отметить занятость. Или попробуйте другой
#   период.», not «…свободна вся команда. Для этого участники должны отметить
#   свою занятость — или попробуйте…»;
# - Russian, a rehearsal the calendar would not take: «Не удалось записать
#   репетиций в календарь: 1.», not «Не удалось записать в календарь
#   репетиций: 1.»;
# - English, one event that would not go: "Removed: 1. Could not remove: 1 —
#   that event is still in the calendar.", not "those events are";
# - Spanish, the same: "Eliminados: 0. Un evento no se pudo eliminar y sigue
#   en el calendario.", not "No se pudieron eliminar: 1 — esos eventos…".
#
# The planner is empty only where no hour is left: its working day ends at
# 23:00, and today offers no half-hour already begun. So Tortsov's profile is
# moved to a zone where it is late evening now (late-evening.js), and he picks
# that one day. The calendar refuses as iOS does with a read-only calendar —
# the app launched with a calendar that will not take «Трактир» nor let
# «Святки» go (e2e/device/expo-calendar.js); the simulator's takes everything.
# He syncs in Russian — «Святки» and «Финал» written, «Трактир» not — and
# removes what was exported in English («Финал» goes, «Святки» stays) and in
# Spanish («Святки» stays again). Each text is checked where it shows and the
# flow goes on, so a run on the old words names every one; it fails at the end
# if any was wrong.
appId: ${APP_ID}
name: Empty planner and calendar refusals read right
tags:
  - planner
  - calendar
  - profile
  - language
---
- evalScript: ${output.wrong = ''}
- runScript:
    file: ../scripts/late-evening.js
    env:
      API_URL: ${API_URL}
      EMAIL: ${TORTSOV_EMAIL}
      PASSWORD: ${PASSWORD}
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      rehearslyCalendarRefusesWrite: "Трактир"
      rehearslyCalendarRefusesDelete: "Святки"
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${TORTSOV_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000

# Russian: the planner over his late evening, that one day.
- tapOn:
    id: tab-planner
- extendedWaitUntil:
    visible:
      id: planner-period-custom
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: planner-period-custom
      SEE: "Выберите период"
      WAIT_MS: "10000"
# The picker opens on the week the planner had: the first tap begins a new
# period on today, the second ends it there.
- tapOn:
    id: date-range-calendar.day_${output.lateDay}
- tapOn:
    id: date-range-calendar.day_${output.lateDay}
- tapOn: "Готово"
- extendedWaitUntil:
    visible: "Здесь появляются часы, когда свобод.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 92-planner-empty-ru
- runFlow:
    when:
      notVisible: "Здесь появляются часы, когда свободны все участники\\. Для этого им нужно отметить занятость\\. Или попробуйте другой период\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: the empty planner, свободны все участники | '}"

# Russian: the sync, «Трактир» refused.
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-calendar-sync
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-calendar-sync
      SEE: ".*Календарь iPhone.*"
      WAIT_MS: "15000"
- tapOn:
    text: "(Разрешить|Предоставить) доступ"
    optional: true
- tapOn:
    text: "Allow Full Access"
    optional: true
# Taken once more if the simulator lost it (T-207); a second tap only turns
# sync on again.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Календарь iPhone.*"
      SEE: ".*Синхронизировать.*"
      WAIT_MS: "10000"
- tapOn:
    id: calendar-sync-run
- extendedWaitUntil:
    visible: "(?s).*Не удалось записать.*"
    timeout: 30000
- takeScreenshot: 92-export-refused-ru
- runFlow:
    when:
      notVisible: "(?s).*Не удалось записать репетиций в календарь: 1\\..*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: Не удалось записать репетиций в календарь: 1 | '}"
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "(?s).*Не удалось записать.*"
    timeout: 10000

# English: what was exported removed, «Святки» refused.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: header-back
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- swipe:
    start: "50%, 40%"
    end: "50%, 85%"
    duration: 400
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "English"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-en
      SEE: "Profile, tab.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-calendar-sync
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-calendar-sync
      SEE: ".*Sync Now.*|.*Synchronize.*"
      WAIT_MS: "15000"
# Not centred: brought only into view it stays low, under the alert's buttons,
# so the alert's own is the one between its title and its Cancel.
- scrollUntilVisible:
    element:
      id: calendar-sync-remove-all
    direction: DOWN
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: calendar-sync-remove-all
      SEE: "Remove All Rehearsals from the Calendar\\?"
      WAIT_MS: "10000"
- tapOn:
    text: "Remove (Exported Rehearsals|All Exported)"
    below: "Remove All Rehearsals from the Calendar\\?"
    above: "Cancel"
- extendedWaitUntil:
    visible: "Removed: .*"
    timeout: 30000
- takeScreenshot: 92-remove-refused-en
- runFlow:
    when:
      notVisible: "Removed: 1\\. Could not remove: 1 — that event is still in the calendar\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'en: that event is still in the calendar | '}"
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "Removed: .*"
    timeout: 10000

# Spanish: «Святки» refused again, nothing else left to remove.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: header-back
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- swipe:
    start: "50%, 40%"
    end: "50%, 85%"
    duration: 400
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "Español"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-es
      SEE: "Perfil, tab.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-calendar-sync
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-calendar-sync
      # Auto Sync is off since the English removal turned it off (T-270):
      # no "Sincronizar", the switch's row is there.
      SEE: ".*Sincronización automática.*"
      WAIT_MS: "15000"
- scrollUntilVisible:
    element:
      id: calendar-sync-remove-all
    direction: DOWN
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: calendar-sync-remove-all
      SEE: "¿Eliminar todos los ensayos del calendario\\?"
      WAIT_MS: "10000"
- tapOn:
    text: "Eliminar todo lo exportado"
    below: "¿Eliminar todos los ensayos del calendario\\?"
    above: "Cancelar"
- extendedWaitUntil:
    visible: "Eliminados: .*"
    timeout: 30000
- takeScreenshot: 92-remove-refused-es
- runFlow:
    when:
      notVisible: "Eliminados: 0\\. Un evento no se pudo eliminar y sigue en el calendario\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: Un evento no se pudo eliminar y sigue en el calendario | '}"
- tapOn: "OK"

- evalScript: "${console.log('92 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
