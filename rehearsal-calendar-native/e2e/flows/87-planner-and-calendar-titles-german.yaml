# The planner and the calendar's top, in German (T-249; owner, 11.11.2026).
# - The planner is "Planner" in every language, as "Smart Planner" is: its
#   tab and its large title. T-032 had made it "Planer" in German, "Планер"
#   in Russian, "Planificador" in Spanish.
# - The calendar is the app's main screen: no title over its project filter
#   and bell. T-029 had put a large "Kalender" there. Its tab keeps the name.
# Anna, whose account speaks German, only looks: nothing is saved. Flow 65
# sees the same in Russian.
#
# And the words as the German native speaker of T-256 reads them:
# - her row of «Szene mit Kattrin», a rehearsal of hers nobody is on, says
#   "Du bist nicht eingeteilt", not "Du bist nicht in der Besetzung";
# - the availability editor's slots are "Belegte Zeit", not "Beschäftigte
#   Zeit";
# - her busy night, 23:00 to 01:00, ends "am Folgetag", not "Folgetag": the
#   words in the end's button beside its time, fontSize xs, on one line. The
#   clock is the simulator's 12-hour one, "1:00 AM", the longer of the two;
# - the planner's button on her calendar says "Finde die beste Zeit für eine
#   Probe", two days picked are "Ausgewählte Tage: 2" (not "Daten"), and a day
#   gone offers "Einträge für diesen Tag löschen" — each whole on the shot
#   (no-ellipsis); the "+" says "Was möchtest du tun?" to VoiceOver, not "Neue
#   Aktion".
# The flow goes on whatever the words, and fails at the end naming every one
# that was wrong.
appId: ${APP_ID}
name: Planner and the calendar's top in German
tags:
  - calendar
  - planner
  - navigation
  - language
  - availability
  - rehearsals
---
- evalScript: ${output.wrong = ''}
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${COURAGE_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 87-calendar-de
- assertNotVisible:
    id: screen-header-root
- assertVisible:
    id: tab-calendar
    text: "Kalender, tab.*"
- assertVisible:
    id: tab-planner
    text: "Planner, tab.*"
# She runs a project: the planner's button under the week says "Finde die beste
# Zeit für eine Probe", not "Probezeit" (T-256), and whole.
- extendedWaitUntil:
    visible: ".*Finde die beste (Zeit für eine Probe|Probezeit).*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 87-planner-button-de
- runFlow:
    when:
      notVisible: ".*Finde die beste Zeit für eine Probe.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Finde die beste Zeit für eine Probe, not Probezeit | '}"
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 87-planner-button-de
      # The button alone, under the week: the rows below have words of their own.
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.32"
      BOTTOM: "0.40"
- tapOn:
    id: tab-planner
- extendedWaitUntil:
    visible:
      id: planner-filters
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 87-planner-de
- assertVisible:
    text: "Planner"
    above:
      id: planner-filters
- assertNotVisible: "Planer"

# Her rehearsal nobody is on: the row's project and its mark, joined.
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible: "(?s).*Szene mit Kattrin.*Mutter Courage.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 87-not-on-it-de
- runFlow:
    when:
      notVisible: "(?s).*Szene mit Kattrin.*Mutter Courage.*Du bist nicht eingeteilt.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Du bist nicht eingeteilt, not in der Besetzung | '}"

# Her busy night in the availability editor. The "+" says "Was möchtest du
# tun?", not "Neue Aktion" (T-256): VoiceOver reads it, as flow 16 reads the
# Russian; the sheet it opens has no title.
- runFlow:
    when:
      notVisible:
        id: tab-create
        text: "Was möchtest du tun\\?.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Was möchtest du tun?, not Neue Aktion | '}"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-create
      SEE: "Als beschäftigt markieren"
      WAIT_MS: "5000"
- tapOn: "Als beschäftigt markieren"
- scrollUntilVisible:
    element:
      id: day-${EVENING_DAY}
      text: ".*, Teilweise"
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${EVENING_DAY}
- tapOn:
    id: day-${EVENING_DAY}
- extendedWaitUntil:
    visible:
      id: slot-0-start
      text: "(23:00|11:00.PM).*"
    timeout: 10000
- assertVisible:
    id: slot-0-end
    text: "(01:00|1:00.AM).*"
- runFlow:
    when:
      notVisible: "Belegte Zeit"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Belegte Zeit, not Beschäftigte Zeit | '}"
- runFlow:
    when:
      notVisible:
        id: slot-0-next-day
        text: "am Folgetag"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: am Folgetag, not Folgetag | '}"
- waitForAnimationToEnd
- takeScreenshot: 87-night-slot-de
# Whatever the words, they fit: one line of 12 pt, about 14 high (two would
# be about 29), and no "…" drawn in the slot's row.
- assertVisible:
    id: slot-0-next-day
    height: 14
    tolerance: 5
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 87-night-slot-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
# The next day picked too: the editor's title counts "Tage", not "Daten"
# (T-256, the owner's "Tage"), whole.
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: day-${MORNING_DAY}
      SEE: "Ausgewählte (Tage|Daten): 2"
      WAIT_MS: "10000"
- waitForAnimationToEnd
- takeScreenshot: 87-two-days-de
- runFlow:
    when:
      notVisible: "Ausgewählte Tage: 2"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Ausgewählte Tage, not Daten | '}"
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 87-two-days-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- tapOn:
    id: availability-deselect
- extendedWaitUntil:
    notVisible: "Ausgewählte (Tage|Daten): 2"
    timeout: 10000
# A day gone: its button says "Einträge für diesen Tag löschen", not "Daten
# für dieses Datum" (T-256), and is whole. Only from the 2nd of a month: the
# editor begins with this month, so on the 1st it has no day gone.
- runFlow:
    when:
      true: ${YESTERDAY_DAY.slice(0, 7) == TODAY_DAY.slice(0, 7)}
    commands:
      - scrollUntilVisible:
          element:
            id: day-${YESTERDAY_DAY}
          direction: UP
          centerElement: true
          timeout: 30000
      - runFlow:
          file: ../subflows/day-in-reach.yaml
          env:
            DAY: ${YESTERDAY_DAY}
      - tapOn:
          id: day-${YESTERDAY_DAY}
      - extendedWaitUntil:
          visible: ".*(Einträge für diesen Tag|Daten für dieses Datum) löschen.*"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: 87-day-gone-de
      - runFlow:
          when:
            notVisible: ".*Einträge für diesen Tag löschen.*"
          commands:
            - evalScript: "${output.wrong = output.wrong + 'de: Einträge für diesen Tag löschen, not Daten | '}"
      - runScript:
          file: ../scripts/no-ellipsis.js
          env:
            MAIL_URL: ${MAIL_URL}
            SHOT: 87-day-gone-de
            LEFT: "0"
            RIGHT: "1"
            TOP: "0.07"
            BOTTOM: "0.95"
      - tapOn:
          id: availability-deselect
# Nothing changed: the editor closes unasked.
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000

- evalScript: "${console.log('87 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
