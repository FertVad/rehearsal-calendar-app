# The profile's notifications switch says what this phone will get (cause fix
# 20: GC02, GC01). A simulator cannot receive push at all, which is the one
# refusal a flow can bring about: the permission prompt and the server's
# answer to a token are below what the simulator does.
#
# The old switch showed the account's setting alone — on for every account —
# though nothing on this phone could be notified. Turning it on again saved the
# setting, ignored that registering had come to nothing and buzzed success; a
# refused permission and a lost connection went the same way. Now it reads off
# here, and turning it on says why it stays off.
appId: ${APP_ID}
name: The notifications switch tells what this phone gets
tags:
  - profile
  - notifications
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${POLONIUS_EMAIL}
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 30000
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-notifications
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 33-switch-before
# On: the phone says it cannot, and nothing reads as done.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-notifications
      SEE: ".*This device cannot receive push notifications.*"
      WAIT_MS: "10000"
- takeScreenshot: 33-cannot-receive
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: ".*This device cannot receive push notifications.*"
    timeout: 10000
- assertVisible:
    id: profile-notifications
    checked: false
- takeScreenshot: 33-switch-after
