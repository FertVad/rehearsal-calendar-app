# Saving a day in the availability editor writes that day and only that day
# (cause fix 2: PUT /availability/days, CC05). Konstantin Treplev is busy all
# day on OTHER_DAY. With the editor open, another device of his marks that day
# free; he then marks MARK_DAY busy 10:00-18:00 here and saves. Back in the
# editor, MARK_DAY has its hours, the days either side of it nothing, and
# OTHER_DAY is still free: the old save sent every loaded day, and put the
# busy day it had loaded back over the newer one. He is in no project, so no
# other flow's rehearsals land on his days.
# Save is in the editor from the first day picked, and off until a change
# (T-009).
# Then a second slot over the first: the save refuses, naming MARK_DAY. The old
# error read the day as UTC midnight with the device's clock (Honolulu): the
# day before (cause fix 14).
# Closed with nothing unsaved, the editor goes at once; closed with that slot
# unsaved, it asks first, with no "Save" for a change the save refuses. The
# close button closed it at once and the change was gone (T-013).
# It opens on this week; a save says "Saved" for a moment instead of an alert
# and leaves the calendar where it was; the sheet's "Clear" is "Deselect"; a
# save that fails, the sheet's or the close question's, says why on the screen
# (T-021).
appId: ${APP_ID}
name: Availability saves the day it changed
tags:
  - availability
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${TREPLEV_EMAIL}
- tapOn:
    id: tab-create
- tapOn: "Mark Busy"
# It opens on this week, not on the first of the month (T-021): today's week
# is the first row under the legend, this month's title gone up above it.
# Opened at the top, the title was there whatever the date.
- extendedWaitUntil:
    visible:
      id: day-${TODAY_DAY}
      below:
        id: availability-legend
    timeout: 30000
- assertNotVisible:
    text: "${THIS_MONTH_LABEL}"
    below:
      id: availability-legend
- takeScreenshot: 10-opens-on-this-week
# Loaded once OTHER_DAY shows the seeded mark.
- scrollUntilVisible:
    element:
      id: day-${OTHER_DAY}
      text: ".*, Busy"
    direction: DOWN
    centerElement: true
    timeout: 30000
# Another device saves OTHER_DAY as free; the screen keeps what it loaded.
- runScript:
    file: ../scripts/mark-day-free.js
    env:
      API_URL: ${API_URL}
      EMAIL: ${TREPLEV_EMAIL}
      PASSWORD: ${PASSWORD}
      DAY: ${OTHER_DAY}
# MARK_DAY: busy for hours, the default 10:00-18:00. It is three days before
# OTHER_DAY, so above it, and off the top once OTHER_DAY is in November.
- scrollUntilVisible:
    element:
      id: day-${MARK_DAY}
    direction: UP
    centerElement: true
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${MARK_DAY}
- tapOn:
    id: day-${MARK_DAY}
# Save is there from the first day picked, off until something changes; it
# used to appear only then, under the finger (T-009).
- assertVisible:
    id: availability-save
    enabled: false
- tapOn:
    id: mode-custom
- extendedWaitUntil:
    visible:
      id: slot-0-start
      text: "10:00.AM.*"
    timeout: 10000
- assertVisible:
    id: slot-0-end
    text: "6:00.PM.*"
- tapOn:
    id: availability-save
# Saved without an alert to dismiss: "Saved" for two seconds (T-021).
- extendedWaitUntil:
    visible:
      id: toast
      text: "Saved"
    timeout: 15000
- takeScreenshot: 10-saved-notice
- assertNotVisible: "Availability saved"
- assertNotVisible: "OK"
- assertNotVisible:
    id: availability-save
# And the calendar stays where it was. Saved two months on, far below this
# month's title, the list is still there once the save is read back; it came
# back at its top, this month's title under the legend (T-021).
- scrollUntilVisible:
    element:
      id: day-${LATER_DAY}
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${LATER_DAY}
- tapOn:
    id: day-${LATER_DAY}
- tapOn:
    id: mode-busy
- waitForAnimationToEnd
- assertNotVisible:
    text: "${THIS_MONTH_LABEL}"
    below:
      id: availability-legend
- tapOn:
    id: availability-save
- extendedWaitUntil:
    notVisible:
      id: availability-save
    timeout: 15000
# The notice gone, two seconds on, the save has been read back.
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: day-${LATER_DAY}
      text: ".*, Busy"
      below:
        id: availability-legend
    timeout: 10000
- assertNotVisible:
    text: "${THIS_MONTH_LABEL}"
    below:
      id: availability-legend
- takeScreenshot: 10-saved-in-place
# Away and back: the editor loads from the server again. Everything is saved,
# so it closes without asking (T-013).
- tapOn:
    id: availability-close
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000
- assertNotVisible: "Don't Save"
- tapOn:
    id: tab-create
- tapOn: "Mark Busy"
- scrollUntilVisible:
    element:
      id: day-${MARK_DAY}
      text: ".*, Partial"
    direction: DOWN
    centerElement: true
    timeout: 30000
# On its own day, not a neighbour.
- assertVisible:
    id: day-${BEFORE_DAY}
    text: "\\d+"
- assertVisible:
    id: day-${AFTER_DAY}
    text: "\\d+"
# The other device's save stands.
- scrollUntilVisible:
    element:
      id: day-${OTHER_DAY}
    direction: DOWN
    centerElement: true
- assertVisible:
    id: day-${OTHER_DAY}
    text: ".*, Free"
- assertNotVisible:
    id: day-${OTHER_DAY}
    text: ".*, Busy"
# And MARK_DAY holds its hours.
- scrollUntilVisible:
    element:
      id: day-${MARK_DAY}
    direction: UP
    centerElement: true
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${MARK_DAY}
- tapOn:
    id: day-${MARK_DAY}
- extendedWaitUntil:
    visible:
      id: mode-custom
      selected: true
    timeout: 10000
# The sheet's button lets go of the days picked; "Clear" read as emptying
# them (T-021).
- assertVisible: "Deselect"
- assertNotVisible: "Clear"
- assertVisible:
    id: slot-0-start
    text: "10:00.AM.*"
- assertVisible:
    id: slot-0-end
    text: "6:00.PM.*"
- takeScreenshot: 10-availability-days
# A second slot, the default 10:00-18:00 again, overlaps the first.
- tapOn: ".*Add slot.*"
- assertVisible:
    id: slot-1-start
    text: "10:00.AM.*"
- tapOn:
    id: availability-save
- extendedWaitUntil:
    visible: "Cannot save"
    timeout: 10000
- assertVisible: "Error \\(${MARK_DAY_LABEL}\\):[\\s\\S]*Slots must not overlap[\\s\\S]*"
- takeScreenshot: 10-availability-overlap
- tapOn: "Understood"
# The overlapping slot is not saved: closing asks first (T-013).
- tapOn:
    id: availability-close
- extendedWaitUntil:
    visible: "Don't Save"
    timeout: 5000
- takeScreenshot: 10-close-asks
- tapOn: "Don't Save"
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000
# A save that fails says why on the screen, not in an alert (T-021): the
# sheet's own Save above that button, and the close question's Save on the
# screen, which stays open with the change. The
# request is held past the app's ten seconds, so the app gives up on it.
- tapOn:
    id: tab-create
- tapOn: "Mark Busy"
- scrollUntilVisible:
    element:
      id: day-${MARK_DAY}
      text: ".*, Partial"
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    file: ../subflows/day-in-reach.yaml
    env:
      DAY: ${MARK_DAY}
- tapOn:
    id: day-${MARK_DAY}
- extendedWaitUntil:
    visible:
      id: mode-custom
      selected: true
    timeout: 10000
- tapOn:
    id: mode-busy
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: PUT
      PATH: "/availability/days$"
      BEFORE: "1"
      ONCE: "1"
      MS: "40000"
- tapOn:
    id: availability-save
- extendedWaitUntil:
    visible:
      id: availability-save-error
      text: "Failed to save availability"
      above:
        id: availability-save
    timeout: 25000
- assertNotVisible: "OK"
- takeScreenshot: 10-save-error-above-save
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      EXPECT: "1"
# Letting go of the day with it changed asks, as the editor's arrow does
# (T-026, review); a tap outside the popover is its Cancel, and the editor
# stays up with the change.
- tapOn:
    id: day-${MARK_DAY}
- extendedWaitUntil:
    visible: "Don't Save"
    timeout: 5000
- tapOn:
    point: "50%, 8%"
- extendedWaitUntil:
    notVisible: "Don't Save"
    timeout: 5000
- assertVisible:
    id: availability-save
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: PUT
      PATH: "/availability/days$"
      BEFORE: "1"
      ONCE: "1"
      MS: "40000"
- tapOn:
    id: availability-close
- extendedWaitUntil:
    visible: "Don't Save"
    timeout: 5000
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: availability-save-error
      text: "Failed to save availability"
    timeout: 25000
- assertNotVisible: "OK"
- assertVisible:
    id: availability-legend
- takeScreenshot: 10-save-error-on-close
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      EXPECT: "1"
- tapOn:
    id: availability-close
- extendedWaitUntil:
    visible: "Don't Save"
    timeout: 5000
- tapOn: "Don't Save"
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000
