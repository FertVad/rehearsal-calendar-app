# The next person on a running app sees their own count and their own
# language (cause fix 12: NI03, HC01). Yasha has a notification unread and
# signs out; Dunyasha, who has none and whose account speaks Russian, signs in
# on the same app. Her count does not arrive, as on no network: the old app
# showed Yasha's "1" on her bell, and stayed in
# English, since the account's language only reached the screen at the next
# start.
#
# And her language reads as a native speaker's (T-256): the "+" is «Добавить»,
# not «Новое действие» (VoiceOver reads it; the sheet it opens has no title
# and, in iOS 26, no Cancel). The flow goes on whatever the words, and fails
# at the end naming every one that was wrong.
appId: ${APP_ID}
name: Switch accounts - count and language
tags:
  - auth
  - notifications
  - profile
---
- evalScript: ${output.wrong = ''}
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${YASHA_EMAIL}
- extendedWaitUntil:
    visible:
      id: unread-badge
    timeout: 30000
- takeScreenshot: 16-yasha-unread
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-logout
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: GET
      PATH: "^/api/native/notifications/unread-count$"
      # Her count does not come at all, as offline: each read of it fails, its
      # connection closed (not held past ten seconds: those are iOS's, T-220).
      DROP: "1"
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${DUNYASHA_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
# Hers did not come: nothing is known, so nothing is shown (NI03).
- assertNotVisible:
    id: unread-badge
# Her account's language, at once (HC01).
- extendedWaitUntil:
    visible:
      id: calendar-filter
      text: ".*Все проекты.*"
    timeout: 10000
- takeScreenshot: 16-dunyasha-own-count-and-language
- runFlow:
    when:
      notVisible:
        id: tab-create
        text: "Добавить.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: «+» is Добавить | '}"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-create
      SEE: "Отметить занятость"
      WAIT_MS: "10000"
- takeScreenshot: 16-dunyasha-create-sheet
# iOS 26 draws the sheet as a popover with no Cancel: a tap outside closes it.
- tapOn:
    point: "50%, 30%"
- extendedWaitUntil:
    notVisible: "Отметить занятость"
    timeout: 10000
# The hold ends, so the flows after this one read the count; still no "1".
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
- assertNotVisible:
    id: unread-badge

- evalScript: "${console.log('16 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
