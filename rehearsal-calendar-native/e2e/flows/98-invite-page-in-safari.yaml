# Someone without the app opens an invitation link in Safari and sees
# Rehearsly's page in their language, with the way to the App Store (T-267).
# The page was "Rehearsal App", in English or Russian only, and told them to
# install the app without a link to it.
#
# The page is the local server's own /invite/<code> (API_URL without /api),
# opened in English; the other languages are reached by the page's own
# switcher, as a reader switches them (a second link opened into the running
# Safari kept the language of the first - flow 70). Each language is written on
# its own, so each is read on its own: the heading, both steps and both
# buttons.
#
# The page tries to open the app as it loads. The app is on this simulator, so
# Safari may ask whether to open it; the flow says no, as someone without the
# app would get no app, and the page then shows the steps.
#
# The App Store button is seen, not followed: the simulator has no App Store,
# and Safari answers apps.apple.com's hand-over to it with "Safari cannot open
# the page because the address is invalid". Where the button leads
# (apps.apple.com/app/id6830809401) is Jest's (server/__tests__/routes/
# invitePage.test.js).
#
# Rehearsly is stopped first: the flow before this one leaves it running, and
# with it behind Safari Maestro's driver read the app's screen, not the page -
# ".*Rehearsly.*" was found there - and once waited 60 s on it as iOS
# suspended it (T-277, docs/e2e.md). Safari's question still comes: it is
# asked because the app is installed, not because it runs.
#
# Safari starts with no tabs (T-404): ".*Rehearsly.*" is in the title of any
# page of ours, and a tab restored from flow 70 or an earlier run - "Privacy
# Policy — Rehearsly" - would answer the first wait before this link's page
# came. And the Safari the link launches is checked readable
# (open-in-safari.yaml, T-431): on c57a1dc's night run the one openLink
# launched came up with its home inaccessible and its accessibility off, and
# Maestro failed the first wait as "App crashed or stopped" with the page and
# Safari's question on the screen.
appId: com.apple.mobilesafari
name: Invite page in Safari reads Rehearsly and its App Store steps in every language
tags:
  - invite
---
- stopApp: ${APP_ID}
- runFlow:
    file: ../subflows/open-in-safari.yaml
    env:
      LINK: ${API_URL.replace('/api', '')}/invite/${TWELFTH_INVITE}?lang=en
# The brand, or Safari's question 'Open this page in "Rehearsly"?', which hides
# the page from the screen's reader until it is answered.
- extendedWaitUntil:
    visible: ".*Rehearsly.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
    optional: true
# The question's Cancel through tap-and-see.yaml (T-207): run alone, it is the
# first tap of Maestro's session, and the simulator lost it in 1 of 10 such
# runs of the flow before T-431 and 2 of 14 since - backboardd's "we already
# have a service for senderID", then "didn't see a previous touch down ...
# skipping event" - and the question stayed over the page for the whole wait
# below (audit/evidence/T-431/cancel-series.txt).
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - runFlow:
          file: ../subflows/tap-and-see.yaml
          env:
            TAP: "Cancel"
            GONE: "Open this page in.*"
            WAIT_MS: 5000
- extendedWaitUntil:
    visible: "Open in the App Store"
    timeout: 15000
- assertVisible: ".*invited to a project"
- assertVisible: "Install Rehearsly from the App Store."
- assertVisible: ".*Come back to this page and tap.*Open invitation.*"
- assertVisible: "Open invitation"
- assertNotVisible: ".*Rehearsal App.*"
- takeScreenshot: 98-invite-en

- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "RU"
      SEE: "Вас пригласили в проект"
      WAIT_MS: 10000
- assertVisible: "Установите Rehearsly из App Store."
- assertVisible: "Открыть в App Store"
- assertVisible: ".*Вернитесь на эту страницу и нажмите.*Открыть приглашение.*"
- assertVisible: "Открыть приглашение"
- takeScreenshot: 98-invite-ru

- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "ES"
      SEE: "Tienes una invitación a un proyecto"
      WAIT_MS: 10000
- assertVisible: "Instala Rehearsly desde el App Store."
- assertVisible: "Abrir en el App Store"
- assertVisible: ".*Vuelve a esta página y toca.*Abrir invitación.*"
- assertVisible: "Abrir invitación"
- takeScreenshot: 98-invite-es

- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "DE"
      SEE: "Du wurdest zu einem Projekt eingeladen"
      WAIT_MS: 10000
- assertVisible: "Installiere Rehearsly aus dem App Store."
- assertVisible: "Im App Store öffnen"
- assertVisible: ".*Komm auf diese Seite zurück und tippe auf.*Einladung öffnen.*"
- assertVisible: "Einladung öffnen"
- takeScreenshot: 98-invite-de
