# A new project is created from the "+" sheet and opens with its creator as
# the owner. The name is typed and "Create" pressed with the keyboard still up:
# that tap used to only hide the keyboard.
appId: ${APP_ID}
name: Create a project
tags:
  - projects
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
- tapOn:
    id: tab-create
- tapOn: "Create Project"
# "Create" waits for a name (T-025), as "Sign in" waits for its fields: it was
# on with the name empty, and a tap answered "Name is required" in an alert.
- extendedWaitUntil:
    visible: "Enter name"
    timeout: 10000
- assertVisible:
    text: "Create"
    enabled: false
- tapOn: "Create"
- assertNotVisible: "Name is required"
- tapOn: "Enter name"
- inputText: "   "
- assertVisible:
    text: "Create"
    enabled: false
- tapOn: "Create"
- assertNotVisible: "Name is required"
- takeScreenshot: 03-create-off-without-a-name
- eraseText
- inputText: "Macbeth"
- assertVisible:
    text: "Create"
    enabled: true
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Macbeth"
    timeout: 15000
- assertVisible: ".*Anna Director, Owner.*"
- assertVisible: "No upcoming rehearsals"
- takeScreenshot: 03-new-project
