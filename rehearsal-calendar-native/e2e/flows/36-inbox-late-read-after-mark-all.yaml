# A read that fails late does not undo a later one that landed (cause fix 21,
# review). Tuzenbach opens a notification on a slow connection — its "read"
# does not get through — and then marks all read on a good one, which does.
# When the first gave up, the old screen put that card back unread, and the
# "Mark all read" button with it, though the server had everything read.
appId: ${APP_ID}
name: Inbox late read after mark all
tags:
  - notifications
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${TUZENBACH_EMAIL}
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: ".*Name-day toast.*"
    timeout: 15000
# The next "read" only is held on its way, and fails when released: its
# connection closed, not handed to the server. Not left to iOS's ten seconds,
# which it need not keep (T-220): the failure comes when the flow says, after
# "Mark all read" has landed.
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: POST
      PATH: "^/api/native/notifications/read$"
      BEFORE: "1"
      DROP: "1"
      MS: "30000"
      ONCE: "1"
- tapOn: ".*Brickworks shift.*"
- tapOn: "Mark all read"
- extendedWaitUntil:
    notVisible: "Mark all read"
    timeout: 10000
# Now the first "read" fails. The old screen put the button back at once.
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      EXPECT: "1"
- extendedWaitUntil:
    visible: "Mark all read"
    timeout: 5000
    optional: true
- assertNotVisible: "Mark all read"
- takeScreenshot: 36-still-read
