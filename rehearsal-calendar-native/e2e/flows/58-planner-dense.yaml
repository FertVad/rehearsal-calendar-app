# The planner's list, denser (T-020; owner, 30.10.2026, on the UX audit of
# 29.10): a day's header is 28 pt and a slot's row 52 (56 until T-026, owner
# 02.11; its "+" in it 44 a side). A day of one slot took 167 pt, and a week
# four screens. The project, the period and the people were one row of 44 pt
# (T-020), and cut in it in every language; they are one under another now:
# the project's name, Week | Month | Dates, the people by their faces (owner,
# 09.11; T-241, flow 59).
#
# The planner is a tab's first screen, with the large title "Planner" the other
# tabs have and the row right under it; it had a "←" back to the calendar and
# a small grey "Smart Planner" over the row, as a screen pushed in from
# somewhere (owner, 04.11; T-032). The calendar's "Smart Planner" opens the
# same tab on its project, and with no "←" either.
#
# Olga Stage's Three Sisters, as in flow 07: tomorrow is free for all three,
# one slot, "All day" from 09:00. Nothing is saved.
appId: ${APP_ID}
name: Planner list is dense
tags:
  - planner
  - calendar
  - participants
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${STAGE_EMAIL}
# From the calendar: the planner on one of her projects.
- scrollUntilVisible:
    element: ".*Smart Planner.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Smart Planner.*"
      SEE: "Planner"
      WAIT_MS: "10000"
- extendedWaitUntil:
    visible:
      id: planner-project
      text: ".*(Three Sisters|The Bear).*"
    timeout: 15000
- assertVisible:
    id: planner-filters
    below: "Planner"
- assertNotVisible: "Back"
- takeScreenshot: 58-planner-from-calendar
- tapOn: "Planner, tab.*"
- assertVisible:
    id: planner-filters
    below: "Planner"
- assertNotVisible: "Back"
- tapOn:
    id: planner-project
- tapOn: "Three Sisters"
- extendedWaitUntil:
    visible:
      id: planner-slot-${TOMORROW_DAY}
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 58-planner-first-screen
# Maestro matches an element's size: 28 and 52 pt.
- assertVisible:
    id: planner-day-${TOMORROW_DAY}
    height: 28
    tolerance: 1
- assertVisible:
    id: planner-row-${TOMORROW_DAY}-09:00
    height: 52
    tolerance: 1
# The period: its three segments in sight, the picked one selected, a tap each.
- assertVisible:
    id: planner-period-week
    selected: true
- assertVisible:
    id: planner-period-custom
    text: "Dates"
- takeScreenshot: 58-period-choice
- tapOn:
    id: planner-period-month
- extendedWaitUntil:
    visible:
      id: planner-period-month
      selected: true
    timeout: 10000
- assertVisible:
    id: planner-period-week
    selected: false
- extendedWaitUntil:
    visible:
      id: planner-slot-${TOMORROW_DAY}
    timeout: 30000
- tapOn:
    id: planner-period-week
- extendedWaitUntil:
    visible:
      id: planner-period-week
      selected: true
    timeout: 10000
# The project: the director's projects, and the one picked stays.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: planner-project
      SEE: "The Bear"
      WAIT_MS: "5000"
- takeScreenshot: 58-project-choice
# The picked one by its name, as a whole option (T-219): its checkmark's glyph
# once rode in the name, "Three Sisters, ", and the tap found the name only
# when iOS happened to show the option's text on its own.
- tapOn:
    text: "Three Sisters"
    selected: true
- extendedWaitUntil:
    notVisible: "The Bear"
    timeout: 10000
# The people: their sheet, everyone in it.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: participants-row
      SEE: "All participants, 3 of 3"
      WAIT_MS: "5000"
- takeScreenshot: 58-participants-choice
- tapOn:
    id: participants-done
- extendedWaitUntil:
    visible:
      id: participants-row
      text: "Participants, 3 of 3"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: planner-row-${TOMORROW_DAY}-09:00
    timeout: 30000
- takeScreenshot: 58-planner-after
