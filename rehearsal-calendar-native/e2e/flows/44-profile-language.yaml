# The language chosen in the profile (T-005). Vershinina switches to Russian:
# the tabs speak it at once, after a restart, and after she signs out, the app
# is cleared and she signs in again — the account keeps it, not the phone.
# Then back to English. Flow 16 is the other half: another account's language
# on a running app.
#
# The first try at this flow (T-001) failed on two things outside the app. A
# tab is one accessibility element, labelled "Календарь, tab, 1 of 5" by React
# Navigation, and Maestro matches the whole label: "Календарь" alone never
# matched. And the picker opened a second time was a second React Native
# Modal on the screen, which iOS leaves out of the accessibility tree, so
# "English" was drawn and not found (T-208, every sheet is an AppModal since).
#
# The tab taps go through tap-and-see.yaml: the simulator lost the one on the
# profile tab after the restart, the calendar stayed, and the flow failed
# looking for the sign-out (T-212; docs/e2e.md, "A lost tap").
appId: ${APP_ID}
name: The profile's language, kept by the account
tags:
  - profile
  - auth
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${VERSHININA_EMAIL}
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Calendar, tab.*"
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- assertVisible:
    id: profile-language
    text: ".*English.*"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "Русский"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-ru
      SEE: "Календарь, tab.*"
      WAIT_MS: "10000"
- assertVisible:
    id: tab-calendar
    text: "Календарь, tab.*"
- assertVisible:
    id: tab-projects
    text: "Проекты, tab.*"
- assertVisible:
    id: tab-profile
    text: "Профиль, tab.*"
- assertVisible:
    id: profile-language
    text: ".*Русский.*"
- takeScreenshot: 44-russian

# A restart, nothing cleared: still Russian.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Календарь, tab.*"
    timeout: 30000
- assertVisible:
    id: tab-projects
    text: "Проекты, tab.*"
- takeScreenshot: 44-russian-after-restart

# Signed out, the app cleared, signed in again: Russian, from her account.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-logout
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${VERSHININA_EMAIL}
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Календарь, tab.*"
    timeout: 30000
- assertVisible:
    id: tab-profile
    text: "Профиль, tab.*"
- takeScreenshot: 44-russian-from-account

# «Помощь» opens the support page (T-011): it had no onPress. The page comes
# from the server the app talks to, here the local one, asked with ?lang=ru.
# Its language is chosen by legal.js, which Safari does not run here: the
# server's CSP upgrades the page's scripts to https, which the local http
# server does not answer. So the page shows its markup's English; the link's
# language and legal.js keeping it are Jest's (ProfileScreen.about,
# legalPageLanguage).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-help
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-help
- extendedWaitUntil:
    visible: "Support"
    timeout: 20000
- assertVisible: ".*support@rehearsly.me.*"
- takeScreenshot: 44-support-page
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: profile-help
    timeout: 20000

# Back to English.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- assertVisible:
    id: profile-language
    text: ".*Русский.*"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "English"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-en
      SEE: "Calendar, tab.*"
      WAIT_MS: "10000"
- assertVisible:
    id: tab-projects
    text: "Projects, tab.*"
- assertVisible:
    id: profile-language
    text: ".*English.*"
- takeScreenshot: 44-english-again
