# The language chosen in the profile (T-005). Vershinina switches to Russian:
# the tabs speak it at once, after a restart, and after she signs out, the app
# is cleared and she signs in again — the account keeps it, not the phone.
# Then back to English. Flow 16 is the other half: another account's language
# on a running app.
#
# The first try at this flow (T-001) failed on two things outside the app. A
# tab is one accessibility element, labelled "Календарь, tab, 1 of 5" by React
# Navigation, and Maestro matches the whole label: "Календарь" alone never
# matched. And the picker opened a second time was a second React Native
# Modal on the screen, which iOS leaves out of the accessibility tree, so
# "English" was drawn and not found (T-208, every sheet is an AppModal since).
#
# The tab taps go through tap-and-see.yaml: the simulator lost the one on the
# profile tab after the restart, the calendar stayed, and the flow failed
# looking for the sign-out (T-212; docs/e2e.md, "A lost tap").
#
# Back in English, the week's row reads as iOS's own (T-256): "Start Week
# On", as Settings › Calendar says it, not "Week starts on". The flow goes on
# whatever the words, and fails at the end naming every one that was wrong.
appId: ${APP_ID}
name: The profile's language, kept by the account
tags:
  - profile
  - auth
---
- evalScript: ${output.wrong = ''}
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${VERSHININA_EMAIL}
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Calendar, tab.*"
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- assertVisible:
    id: profile-language
    text: ".*English.*"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "Русский"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-ru
      SEE: "Календарь, tab.*"
      WAIT_MS: "10000"
- assertVisible:
    id: tab-calendar
    text: "Календарь, tab.*"
- assertVisible:
    id: tab-projects
    text: "Проекты, tab.*"
- assertVisible:
    id: tab-profile
    text: "Профиль, tab.*"
- assertVisible:
    id: profile-language
    text: ".*Русский.*"
- takeScreenshot: 44-russian

# A restart, nothing cleared: still Russian.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Календарь, tab.*"
    timeout: 30000
- assertVisible:
    id: tab-projects
    text: "Проекты, tab.*"
- takeScreenshot: 44-russian-after-restart

# Signed out, the app cleared, signed in again: Russian, from her account.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-logout
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${VERSHININA_EMAIL}
- extendedWaitUntil:
    visible:
      id: tab-calendar
      text: "Календарь, tab.*"
    timeout: 30000
- assertVisible:
    id: tab-profile
    text: "Профиль, tab.*"
- takeScreenshot: 44-russian-from-account

# «Помощь» opens the support page (T-011): it had no onPress, and a tap on it
# left the profile on screen. The page comes from the server the app talks
# to, here the local one, asked with ?lang=ru. Its language is chosen by
# legal.js, which Safari does not run here: the server's CSP upgrades the
# page's scripts to https, which the local http server does not answer. So
# the flow reads only what the page says in every language, its address;
# the link's language and legal.js keeping it are Jest's (ProfileScreen.about,
# legalPageLanguage). The version is Jest's too: the build's is 1.0.0, the number
# the screen had written in, and nothing on screen tells them apart.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-help
    direction: DOWN
    centerElement: true
- takeScreenshot: 44-profile-about
# Safari with no tabs (T-404): a restored support page of an earlier run would
# answer the wait below before this tap's page came.
# The tap's Safari is not the first Safari Maestro meets in the run (T-418).
# Run alone, it was, and it came up with its accessibility off and kept it off
# ("app ax: 0" in the device log): every read of Safari was
# kAXErrorAPIDisabled, and Maestro, the app not in front, failed the step as a
# crash, the page on the screen. Once Maestro's driver has asked Safari for its
# screen, every later launch of Safari comes up with it on (docs/e2e.md,
# "Safari's first launch"). So Maestro launches Safari and reads it until the
# app is no longer what it reads - the read of a Safari with accessibility off
# fails, which is why it is optional: the asking is what counts, not the answer
# - then fresh-safari.yaml stops it, and the tap launches it again.
- runFlow: ../subflows/fresh-safari.yaml
- launchApp:
    appId: com.apple.mobilesafari
    stopApp: false
- extendedWaitUntil:
    notVisible:
      id: tab-profile
    timeout: 20000
    optional: true
- runFlow: ../subflows/fresh-safari.yaml
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: profile-help
    timeout: 20000
- tapOn:
    id: profile-help
- extendedWaitUntil:
    visible: ".*support@rehearsly.me.*"
    timeout: 20000
- assertNotVisible:
    id: profile-help
- takeScreenshot: 44-support-page
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: profile-help
    timeout: 20000

# «Политика конфиденциальности» (T-039): App Review 5.1.1 wants the policy
# opened from the app itself, and it was only a link at the foot of the
# support page. Its row is in About, between Help and the bug report. A tap
# opens the server's /privacy with ?lang=ru, and the page, its script run
# since T-038, shows its Russian and hides its English. Safari is closed
# first: a link opened into the running one kept the page it had (flow 70).
# And its tabs go with it (T-404): the support page above, restored, has
# "Политика конфиденциальности" at its foot, and would answer the wait.
- scrollUntilVisible:
    element:
      id: profile-privacy
    direction: DOWN
    centerElement: true
- assertVisible:
    id: profile-privacy
    text: ".*Политика конфиденциальности.*"
    below:
      id: profile-help
- assertVisible:
    id: profile-report-bug
    below:
      id: profile-privacy
- takeScreenshot: 44-profile-privacy-row
- runFlow: ../subflows/fresh-safari.yaml
- tapOn:
    id: profile-privacy
- extendedWaitUntil:
    visible: "Политика конфиденциальности"
    timeout: 20000
- assertNotVisible:
    id: profile-privacy
- assertNotVisible: "Privacy Policy"
- takeScreenshot: 44-privacy-page
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: profile-privacy
    timeout: 20000

# Back to English. The profile is still scrolled down to the privacy row. Its
# language row used to stay clipped under the title, which stays put (T-029):
# on screen to Maestro, which found "Язык, Русский" there, though a tap on it
# lands on the title. Since "Выходные заняты" (T-406) and "Оценить Rehearsly"
# (T-410) made the profile two rows longer, the row is above the screen's
# top, off the hierarchy, and the check of it failed (T-416). So the profile
# is taken back to the top first - with short swipes until the row is below
# the title - and then the row is checked and tapped.
- repeat:
    times: 4
    while:
      notVisible:
        id: profile-language
        below: "Профиль"
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 85%"
          duration: 400
      - waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Язык, Русский.*"
      WAIT_MS: "10000"
- assertVisible:
    id: profile-language
    text: ".*Русский.*"
    below: "Профиль"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-language
      SEE: "English"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: language-en
      SEE: "Calendar, tab.*"
      WAIT_MS: "10000"
- assertVisible:
    id: tab-projects
    text: "Projects, tab.*"
- assertVisible:
    id: profile-language
    text: ".*English.*"
- takeScreenshot: 44-english-again
- scrollUntilVisible:
    element: ".*(Start Week On|Week starts on).*"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      notVisible: ".*Start Week On.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'en: Start Week On, as iOS | '}"

- evalScript: "${console.log('44 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
