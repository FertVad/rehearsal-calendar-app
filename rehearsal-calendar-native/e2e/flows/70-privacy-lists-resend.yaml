# The privacy policy, as someone reads it in Safari, names Resend among the
# providers that process their data — in each of its four languages (T-038).
# Since 04.11 the server mails sign-up, password-reset and change-of-address
# codes through Resend (EU, Ireland), and the page did not say so.
#
# The page is the local server's own /privacy (API_URL without /api), opened in
# each language by its own link, ?lang=xx, at the list of providers,
# #processors-xx — as a link from the app or a mail would point a reader to it.
# Scrolling there from the top of the page took 13 swipes of ~4.3 s in English
# alone, and every new paragraph of the policy added more: on 477ea2f, after
# T-293 and T-295, the line was not reached in the 60 s (T-296). From the
# anchor the line is on screen or one swipe away, however long the policy
# grows above it. (A second link into the running Safari once left the page in
# English; that was the CSP sending legal.js to https, fixed in T-038.)
#
# Each language is written on its own, so each is read on its own: the line is
# matched by its words, not only the name, since "Resend" in bold is an element
# of its own. The words are the native editors' (T-269, 64d7860): "sends our
# emails: your codes for signing up", "Versand unserer E-Mails: Codes für
# Registrierung" (T-284).
#
# Rehearsly is stopped first: the flow before this one leaves it running, and
# with it behind Safari Maestro's driver read the app's screen, not the page,
# and once waited 60 s on it as iOS suspended it (T-277, docs/e2e.md).
appId: com.apple.mobilesafari
name: Privacy policy lists Resend in every language
tags:
  - legal
---
- stopApp: ${APP_ID}
- stopApp
- openLink:
    link: ${API_URL.replace('/api', '')}/privacy?lang=en#processors-en
- scrollUntilVisible:
    element: ".*sends our emails: your codes for signing up.*Ireland.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 70-privacy-en

- openLink:
    link: ${API_URL.replace('/api', '')}/privacy?lang=ru#processors-ru
- scrollUntilVisible:
    element: ".*отправка писем с кодами.*Ирландия.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 70-privacy-ru

- openLink:
    link: ${API_URL.replace('/api', '')}/privacy?lang=es#processors-es
- scrollUntilVisible:
    element: ".*envío de los correos con códigos.*Irlanda.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 70-privacy-es

- openLink:
    link: ${API_URL.replace('/api', '')}/privacy?lang=de#processors-de
- scrollUntilVisible:
    element: ".*Versand unserer E-Mails: Codes für Registrierung.*Irland.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 70-privacy-de
- stopApp
