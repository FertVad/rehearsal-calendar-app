# The planner's tab takes the first tap from the profile, in German (T-253).
# The landing's shots on 10.11 and 12.11 tapped "Planner" from "Profil" and
# nothing happened, after one of two ways back to the profile:
# - the form of a new rehearsal over the profile scrolled to its end: people
#   picked, a recommended time taken, the form scrolled, "Abbrechen" and
#   "Nicht speichern";
# - the profile's "Kalender-Sync": sync on, a sync, "Alle exportierten Proben
#   entfernen" confirmed, sync off.
# The second was the shots' own doing (audit/evidence/T-253): they confirmed
# the removal by a tap at 50 %, 55 % and never answered the "removed" alert
# after it, and an alert takes every tap until it is answered - the switch,
# the planner's tab and the calendar's alike. In English the same tap does
# the same. The first did not happen again in seven runs.
# Polly, whose account speaks German, takes both ways, each dialog answered by
# its button, and taps the planner's tab once after each - a plain tap, never
# taken again: the point is the first. Both are said at the end, and the flow
# fails if either did nothing.
appId: ${APP_ID}
name: The planner's tab after the form and after the sync, in German
tags:
  - planner
  - profile
  - navigation
  - rehearsals
  - calendar
  - language
---
- evalScript: ${output.missed = ''}
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${POLLY_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000

# The profile, scrolled to its end.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Sprache, Deutsch.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-delete-account
    direction: DOWN
- waitForAnimationToEnd

# The form over it: Polly's company, a recommended time, the form scrolled,
# and out without saving.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-create
      SEE: "Probe erstellen"
      WAIT_MS: "5000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Probe erstellen"
      SEE: "Probe hinzufügen"
      WAIT_MS: "10000"
- runFlow:
    when:
      notVisible: ".*Die Dreigroschenoper.*"
    commands:
      - tapOn:
          id: rehearsal-project
      - tapOn: ".*Die Dreigroschenoper.*"
- extendedWaitUntil:
    visible:
      id: participants-row
    timeout: 10000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: participants-row
      SEE: ".*Mackie Messer.*"
      WAIT_MS: "10000"
# The whole company comes picked; Jenny is taken off, Mackie stays.
- tapOn: ".*Jenny Diver.*"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: participants-done
      SEE: "Probe hinzufügen"
      WAIT_MS: "10000"
- extendedWaitUntil:
    visible: "Empfohlene Zeit"
    timeout: 15000
# Mackie is busy 12:00-14:00 today; past the evening there may be no time
# left to recommend.
- tapOn:
    id: "recommendation-.*"
    index: 0
    optional: true
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    visible: "Nicht speichern"
    timeout: 5000
- tapOn: "Nicht speichern"
- extendedWaitUntil:
    notVisible:
      id: header-cancel
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: tab-profile
    text: "Profil, tab.*"
    selected: true
- takeScreenshot: 91-profile-after-form

# The planner's tab, once.
- tapOn:
    id: tab-planner
- extendedWaitUntil:
    visible:
      id: planner-filters
    timeout: 10000
    optional: true
- takeScreenshot: 91-after-planner-tap-1
- runFlow:
    when:
      notVisible:
        id: planner-filters
    commands:
      - evalScript: "${output.missed = output.missed + 'after the form | '}"
      # On to the planner, for the second way to start from a tab of its own.
      - tapOn:
          id: tab-planner

# Back to the profile, and its "Kalender-Sync".
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Kalender-Sync.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-calendar-sync
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-calendar-sync
      SEE: ".*Apple Calendar.*"
      WAIT_MS: "15000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Apple Calendar.*"
      SEE: ".*Synchronisieren.*"
      WAIT_MS: "10000"
- tapOn:
    id: calendar-sync-run
- extendedWaitUntil:
    visible: "(Erfolgreich )?[Ss]ynchronisiert"
    timeout: 30000
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: calendar-sync-status
    timeout: 10000
- scrollUntilVisible:
    element: ".*Alle exportierten Proben entfernen.*"
    direction: DOWN
    centerElement: true
- tapOn: ".*Alle exportierten Proben entfernen.*"
- extendedWaitUntil:
    visible: "Alle Proben aus dem Kalender entfernen?"
    timeout: 5000
- waitForAnimationToEnd
# The question's two buttons stand one over the other, its "remove" first;
# while it is up, the screen's own button of the same words is behind it.
- takeScreenshot: 91-remove-all-question
- tapOn: "Alle exportierten Proben entfernen"
# The removal says it is done, and waits for its "OK".
- extendedWaitUntil:
    visible: "Alle Proben aus dem Kalender entfernt"
    timeout: 15000
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "Alle Proben aus dem Kalender entfernt"
    timeout: 5000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: calendar-sync-toggle
      GONE_ID: calendar-sync-run
      WAIT_MS: "10000"
- waitForAnimationToEnd
- takeScreenshot: 91-sync-off

# The planner's tab, once, from the sync screen.
- tapOn:
    id: tab-planner
- extendedWaitUntil:
    visible:
      id: planner-filters
    timeout: 10000
    optional: true
- takeScreenshot: 91-after-planner-tap-2
- runFlow:
    when:
      notVisible:
        id: planner-filters
    commands:
      - evalScript: "${output.missed = output.missed + 'after the sync | '}"

- evalScript: "${console.log('91 planner tab missed: ' + JSON.stringify(output.missed))}"
- runFlow:
    when:
      true: ${output.missed != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: planner-tab-took-the-first-tap
          timeout: 1000
