# Onboarding in Russian, to the end (T-022 review). Nina Novikova is new and
# her account speaks Russian; she refuses the calendar and turns nothing on.
#
# The greeting, "Добро пожаловать, Нина!", is about 402 pt at the title's
# 32 pt, and the iPhone 16 leaves it 345: it wrapped to two lines. The title is
# one line now, made smaller to fit, so its height is one line's. And the
# steps' own words were English whatever the language: "Skip" at the top,
# "Calendar access is required…" when the calendar is refused. Flow 09 walks
# the same steps in English and could not tell.
#
# "No calendars found" and "Setting up calendar sync…" are not here: the
# simulator always has its calendar, and the choice is saved on the phone at
# once. Jest says them in Russian and German (CalendarSyncScreen.test.tsx).
#
# And her steps read as a native speaker's (T-256): access is asked with «Разрешить доступ», as iOS's own window says it, not
# «Предоставить»; the example push is «Вас позвали на репетицию», as the real
# one, not «добавили в репетицию»; the text promises an «уведомление», not a
# «сообщение», and guesses no one's gender («узнать последним»). Then two more
# newcomers walk the same steps, no other flow does in their languages: Adela
# in Spanish, whose last step puts its places in «», not “”; Kattrin in German,
# whose titles and button are "Deine Verfügbarkeit", "Apple Kalender", "Wo ist
# was?", "Verfügbarkeit", each whole. The flow goes on whatever the words, and
# fails at the end naming every one that was wrong.
#
# The second reading (T-261): the last step joins a project "by invitation" in
# all three, and all three leave by Skip, whose window answers nothing and so
# has one "OK" — «ОК» in Russian, as iOS — not «Да», "Sí", "Ja".
#
# T-412: one design on every step — «‹ Назад» at the top, the answers together
# at the bottom, no «Далее» — the calendar step «Синхронизация календаря»,
# "Sincronización del calendario", "Kalender-Sync", the weekends' question in
# three lines with the days on their own, the descriptions in the native
# speakers' lines, and every text typeset by its language's rule: «в», «на»,
# «по» glued to the next word, Spanish "o" too, no line begun by "→" or a dash.
# Each of the five steps is shot in each language for the monitor.
appId: ${APP_ID}
name: Onboarding in Russian, the greeting on one line
tags:
  - onboarding
  - language
  - calendar
# iOS's calendar prompt outlives the app: a failure here must not leave it
# over the next flows (T-299).
onFlowComplete:
  - runFlow:
      file: ../subflows/no-calendar-prompt-left.yaml
---
- evalScript: ${output.wrong = ''}
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${NINA_EMAIL}
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- assertVisible:
    id: onboarding-skip
    text: "Пропустить"
# One line: 32 pt high here, made smaller to the 345 pt; a line at 32 pt is
# 38, and two of them, as it wrapped, about 77.
- assertVisible:
    id: onboarding-title
    text: "Добро пожаловать, Нина!"
    height: 35
    tolerance: 9
- runFlow:
    when:
      notVisible: "Планируйте репетиции,\nуправляйте расписанием\nи\u00a0синхронизируйте календари\nв\u00a0одном месте\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: the welcome in its lines, typeset | '}"
- assertNotVisible:
    id: onboarding-back
- takeScreenshot: 60-onboarding-welcome-ru
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Начать"
      SEE: "(?-i)Отметить все выходные\n\\(${WEEKEND_DAYS_RU_LABEL}\\)\nкак занятые\\?"
      WAIT_MS: 10000
# The weekends, asked outright in her language with the days of her zone's
# country, and where to change it later in the Profile's words (T-406).
#
# T-408: the days in lower case inside the question, «(пт и сб)» — the phone
# said «(Пт и Сб)»: iOS names a day alone with a capital. Maestro matches text
# whatever its case (this flow passed with «пт и сб» then), so the question is
# asked with "(?-i)", which turns that off. The question wraps, up to three
# lines at the title's size, rather than shrinking to one line: there it was
# about 14.5 pt, smaller than the text under it, 17 high; wrapped it is two or
# three lines at about 32. The path whole on its line, no-break spaces in it,
# and the text in the native speaker's words.
- assertVisible: "Это можно включить или выключить позже: Профиль\u00a0→\u00a0Выходные\u00a0заняты"
- assertVisible: "Тогда при подборе времени\nваши выходные будут считаться занятыми\\.\nЛюбой выходной можно отметить иначе\nв\u00a0«Занятости»\\."
# T-412: three lines, made smaller only so far as the longest fits whole,
# never below 26 pt — about 90 to 120 high.
- assertVisible:
    id: onboarding-title
    height: 105
    tolerance: 17
- assertVisible:
    id: onboarding-back
    text: "Назад"
    above:
      id: onboarding-title
- assertVisible:
    text: "Нет, оставить свободными"
    below:
      text: "Да, отметить"
- takeScreenshot: 60-onboarding-weekends-ru
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 60-onboarding-weekends-ru
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Да, отметить"
      SEE: "Синхронизация календаря"
      WAIT_MS: 10000
# The path whole: no line begins with "→" (settingPath, T-412).
- assertVisible: "Это можно сделать потом: Профиль\u00a0→\u00a0Синхронизация"
- runFlow:
    when:
      notVisible: "Репетиции сами попадут в\u00a0ваш календарь,\nа\u00a0занятые часы из\u00a0него\u00a0— в\u00a0Rehearsly\\.\nКоманда видит только эти часы,\nно\u00a0не\u00a0ваши дела\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: the calendar description, typeset | '}"
- runFlow:
    when:
      notVisible: "Разрешить доступ"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: Разрешить доступ, as iOS | '}"
# Access asked at the bottom, over «Настроить позже»; no «Далее».
- assertVisible:
    text: "Настроить позже"
    below:
      text: "Разрешить доступ"
- assertNotVisible: "Далее"
- takeScreenshot: 60-onboarding-calendar-ru
# Refused: the app says why it asks, in her language.
- tapOn: "(Разрешить|Предоставить) доступ"
- extendedWaitUntil:
    visible: "Don’t Allow|Don't Allow"
    timeout: 10000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Don’t Allow|Don't Allow"
      SEE: "Требуется разрешение"
      WAIT_MS: 10000
- assertVisible: "Для этого нужен доступ к календарю"
- assertNotVisible: "Calendar access is required.*"
- takeScreenshot: 60-onboarding-calendar-refused-ru
- tapOn: "OK"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Настроить позже"
      SEE: "Не\u00a0сейчас"
      WAIT_MS: 10000
- assertVisible: "Уведомления"
- takeScreenshot: 60-onboarding-notifications-ru
- runFlow:
    when:
      notVisible: ".*Вас позвали на\u00a0репетицию.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: the example push, Вас позвали на репетицию | '}"
# The owner's words (T-412), the dash at the end of the first line.
- runFlow:
    when:
      notVisible: "Новая репетиция, отменили или перенесли\u00a0—\nвы узнаете сразу\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: the notifications description | '}"
- assertVisible:
    id: onboarding-back
    text: "Назад"
    above:
      id: onboarding-title
- assertVisible:
    text: "Не\u00a0сейчас"
    below:
      text: "Включить"
- assertVisible:
    id: onboarding-skip
    text: "Пропустить"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Не\u00a0сейчас"
      SEE: "Что где"
      WAIT_MS: 10000
- assertVisible: ".*Создать проект.*"
- takeScreenshot: 60-onboarding-what-where-ru
# Where to join a project: «По приглашению», not «По коду: … «Присоединиться
# по коду»», the code twice (T-258).
- assertVisible: "«\\+»\u00a0→ «Создать проект»\\. По\u00a0приглашению: «Проекты»\u00a0→ «Присоединиться по\u00a0коду»"
# She leaves by «Пропустить», not «Начать»: the window that says where the
# settings are answers nothing, so its one button is «ОК», as in Russian iOS,
# not «Да» (T-261).
- assertVisible: "Начать"
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible: "Настройки доступны в профиле"
    timeout: 10000
# With the weekends among what is set later: whoever skips keeps them busy
# (T-408).
- assertVisible: "Начало недели, синхронизацию календаря и то, отмечать ли выходные занятыми, можно настроить в любое время: Профиль → Настройки\\."
- takeScreenshot: 60-onboarding-skip-ru
- assertNotVisible: "Да"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "ОК"
      SEE: "Сегодня"
      WAIT_MS: 15000
- assertVisible:
    id: calendar-today

# Spanish (T-256): Adela, new, her account in Spanish, goes to the last step.
# Its places are in «» as everywhere in Spanish, not “”.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${ADELA_EMAIL}
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- runFlow:
    when:
      notVisible: "Planifica ensayos, gestiona horarios\ny\u00a0sincroniza calendarios en un solo lugar\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the welcome in its lines, typeset | '}"
- takeScreenshot: 60-onboarding-welcome-es
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Empezar"
      SEE: "Sí, marcarlos"
      WAIT_MS: 10000
# Her weekends' step in the native speaker's words (T-408): the days in lower
# case — "(?-i)", as in Russian — the question whole, wrapped at the title's
# size, the path whole on its line.
- runFlow:
    when:
      notVisible: "(?-i)¿Marcar como ocupados\ntodos los fines de semana\n\\(${WEEKEND_DAYS_ES_LABEL}\\)\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the question in its three lines, its days in lower case | '}"
- runFlow:
    when:
      notVisible: "Así, cuando alguien busque un horario,\ntus fines de semana contarán como ocupados\\.\nPuedes cambiar cualquier día\npor separado en Disponibilidad\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the weekends description | '}"
- runFlow:
    when:
      notVisible: "Puedes activarlo o\u00a0desactivarlo más tarde en Perfil\u00a0→\u00a0Fines\u00a0de\u00a0semana\u00a0ocupados"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the weekends note, the path whole | '}"
- assertVisible:
    id: onboarding-title
    height: 105
    tolerance: 17
- takeScreenshot: 60-onboarding-weekends-es
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 60-onboarding-weekends-es
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Sí, marcarlos"
      SEE: "Sincronización del\u00a0calendario"
      WAIT_MS: 10000
- runFlow:
    when:
      notVisible: "Los ensayos aparecerán solos en tu calendario,\ny\u00a0de él llegarán a\u00a0Rehearsly tus horas ocupadas\\.\nEl equipo ve solo esas horas, no tus planes\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the calendar description, typeset | '}"
- waitForAnimationToEnd
- takeScreenshot: 60-onboarding-calendar-es
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Configurar más tarde"
      SEE: "Ahora no"
      WAIT_MS: 10000
- runFlow:
    when:
      notVisible: "Ensayo nuevo, cancelado o\u00a0reprogramado:\nte enterarás al instante\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the notifications description | '}"
- waitForAnimationToEnd
- takeScreenshot: 60-onboarding-notifications-es
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Ahora no"
      SEE: "Dónde está cada cosa"
      WAIT_MS: 10000
- takeScreenshot: 60-onboarding-what-where-es
# "Con una invitación", not "Con un código: … «Unirse con un código»", the
# code twice (T-261).
- runFlow:
    when:
      notVisible: "«\\+»\u00a0→ «Crear proyecto»\\. Con una invitación: «Proyectos»\u00a0→ «Unirse con un código»"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: a project, in «», Con una invitación | '}"
- runFlow:
    when:
      notVisible: "«\\+»\u00a0→ «.*», en los proyectos que administras"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: a rehearsal, in «» | '}"
- runFlow:
    when:
      notVisible: "«\\+»\u00a0→ «Marcar horas ocupadas»"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: availability, in «» | '}"
- runFlow:
    when:
      notVisible: "«Smart Planner», debajo del calendario"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the planner, in «» | '}"
# Skipped, the window's one button is "OK", not "Sí" (T-261).
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible: "Ajustes disponibles en el perfil"
    timeout: 10000
# The weekends among what is set later (T-408).
- runFlow:
    when:
      notVisible: "Puedes elegir el inicio de la semana, decidir si tus fines de semana se marcan como ocupados y configurar la sincronización del calendario cuando quieras en Perfil → Ajustes\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: the skip message names the weekends | '}"
- takeScreenshot: 60-onboarding-skip-es
- runFlow:
    when:
      notVisible: "OK"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: OK after Omitir, not Sí | '}"
      - tapOn: "Sí"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 15000

# German (T-256): Kattrin, new, her account in German, to the last step. The
# calendar's step is "Kalender-Sync" (T-412; it was "Deine Verfügbarkeit",
# before that "Deine Zeiten"), and with the
# calendar allowed its button is "Apple Kalender", not "Apple Calendar" (the
# simulator has no Google account, so no "Google Kalender"); the last is "Wo ist
# was?", not "Was ist wo", its availability "Verfügbarkeit" — each whole on the
# shot (no-ellipsis). Nothing is picked or saved.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      calendar: allow
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${KATTRIN_EMAIL}
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- runFlow:
    when:
      notVisible: "Plane Proben, verwalte Termine\nund synchronisiere Kalender an einem Ort\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the welcome in its lines | '}"
- takeScreenshot: 60-onboarding-welcome-de
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Loslegen"
      SEE: "Ja, markieren"
      WAIT_MS: 10000
# Her weekends' step in the native speaker's words (T-408), the question in
# its three lines (T-412), the path whole on its line.
- runFlow:
    when:
      notVisible: "(?-i)Alle Wochenenden\n\\(${WEEKEND_DAYS_DE_LABEL}\\)\nals belegt markieren\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the question | '}"
- runFlow:
    when:
      notVisible: "Dann gelten deine Wochenenden\nbei der Terminsuche als belegt\\.\nEinzelne Tage kannst du\nunter Verfügbarkeit ändern\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the weekends description | '}"
- runFlow:
    when:
      notVisible: "Ein- und ausschalten kannst du das später unter Profil\u00a0→\u00a0Wochenenden\u00a0belegt"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the weekends note, the path whole | '}"
- runFlow:
    when:
      notVisible: "Nein, nicht markieren"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Nein, nicht markieren | '}"
- assertVisible:
    id: onboarding-title
    height: 105
    tolerance: 17
- takeScreenshot: 60-onboarding-weekends-de
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 60-onboarding-weekends-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Ja, markieren"
      SEE: "Später einrichten"
      WAIT_MS: 10000
- extendedWaitUntil:
    visible: ".*Apple (Kalender|Calendar).*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 60-onboarding-calendar-de
- runFlow:
    when:
      notVisible: "Kalender-Sync"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Kalender-Sync, the step named for what it is | '}"
- runFlow:
    when:
      notVisible: "Proben landen von selbst in deinem Kalender,\nbelegte Zeiten von dort in Rehearsly\\.\nDie anderen im Projekt sehen nur diese Zeiten,\naber nicht, was du vorhast\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the calendar description | '}"
- runFlow:
    when:
      notVisible: ".*Apple Kalender.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Apple Kalender, not Calendar | '}"
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 60-onboarding-calendar-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Später einrichten"
      SEE: "Jetzt nicht"
      WAIT_MS: 10000
- runFlow:
    when:
      notVisible: "Neue Probe, Absage oder Verschiebung\u00a0–\ndu erfährst es sofort\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the notifications description | '}"
- waitForAnimationToEnd
- takeScreenshot: 60-onboarding-notifications-de
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Jetzt nicht"
      SEE: "(Wo ist was\\?|Was ist wo)"
      WAIT_MS: 10000
- waitForAnimationToEnd
- takeScreenshot: 60-onboarding-what-where-de
- runFlow:
    when:
      notVisible: "Wo ist was\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Wo ist was?, not Was ist wo | '}"
- runFlow:
    when:
      notVisible: "Verfügbarkeit"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Verfügbarkeit, not Zeiten | '}"
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 60-onboarding-what-where-de
      LEFT: "0"
      RIGHT: "1"
      TOP: "0.07"
      BOTTOM: "0.95"
# "Per Einladung", not "Mit einem Code: … „Mit einem Code beitreten“" (T-261).
- runFlow:
    when:
      notVisible: "„\\+“\u00a0→ „Projekt erstellen“\\. Per Einladung: „Projekte“\u00a0→ „Mit einem Code beitreten“"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: Per Einladung, not the code twice | '}"
# Skipped: the message ends with its full stop, and the one button is "OK",
# not "Ja" — nothing was asked (T-261).
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible: "Einstellungen im Profil verfügbar"
    timeout: 10000
- runFlow:
    when:
      notVisible: "Du kannst jederzeit den Wochenbeginn ändern, die Kalendersynchronisation einrichten und festlegen, ob deine Wochenenden als belegt gelten – alles unter Profil → Einstellungen\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: the skip message names the weekends, ends with a full stop | '}"
- takeScreenshot: 60-onboarding-skip-de
- runFlow:
    when:
      notVisible: "OK"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'de: OK after Überspringen, not Ja | '}"
      - tapOn: "Ja"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 15000

- evalScript: "${console.log('60 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
