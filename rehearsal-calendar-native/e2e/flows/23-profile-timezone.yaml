# One zone, the one the person chose (cause fix 14: HP04, DF01; the owner's
# decision of 16.10.2026). Chebutykin's profile is in Tel Aviv — set so by the
# seed (seed.mjs, CHOSEN_ZONE), whatever the machine's zone; the simulator is
# in Honolulu (run.mjs), thirteen hours behind it, as if he had flown there.
# Everything stays in Tel Aviv: today, the time of each rehearsal, the
# planner's week. Changing the zone in the profile changes what is shown, on
# the project's page left open too.
#
# The old app wrote the device's zone over the chosen one at sign-in (HP04),
# and took "today" from the device while dating rehearsals by the profile
# (DF01): Midnight call, at 00:30 in Tel Aviv, belongs to yesterday in Honolulu.
# The planner read its week's dates as UTC midnights, the day before in
# Honolulu; the project's page kept the hours of the zone it was opened in.
appId: ${APP_ID}
name: The profile's timezone, not the device's
tags:
  - calendar
  - profile
  - rehearsals
  - planner
  - projects
  - notifications
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${CHEBUTYKIN_EMAIL}
# Today in Tel Aviv: Midnight call is today's, at its Tel Aviv time.
- extendedWaitUntil:
    visible: "(?s)(?=.*Midnight call)(?=.*00:30).*"
    timeout: 30000
- scrollUntilVisible:
    element: "(?s)(?=.*Night watch).*"
    direction: DOWN
    centerElement: true
- assertVisible: "(?s)(?=.*Night watch)(?=.*02:00).*"
- takeScreenshot: 23-calendar-in-tel-aviv
# The planner's week starts on today in Tel Aviv.
- tapOn: "Planner, tab.*"
- extendedWaitUntil:
    visible: "${WEEK_CHOSEN_LABEL}"
    timeout: 15000
- takeScreenshot: 23-planner-week-in-tel-aviv
# The project's page, at Tel Aviv's hours; left open while the zone changes.
- tapOn:
    id: tab-projects
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Doctor Rounds.*"
    timeout: 10000
- waitForAnimationToEnd
# On its name, as in flow 19: his only project, listed first.
- tapOn:
    point: "25%,23%"
- extendedWaitUntil:
    visible: ".*Upcoming Rehearsals.*"
    timeout: 15000
- tapOn: ".*Upcoming Rehearsals.*"
- scrollUntilVisible:
    element: "(?s)(?=.*Night watch).*"
    direction: DOWN
    centerElement: true
# Each card is one button, its texts one label. Its time reads as the
# calendar's card does, "02:00 — 03:00" (one label for both since cause fix 15).
- assertVisible: "(?s)(?=.*Night watch)(?=.*02:00 — 03:00).*"
- takeScreenshot: 23-project-in-tel-aviv
# The profile still says Tel Aviv after signing in on a phone in Honolulu -
# UTC+2, or UTC+3 in Israel's summer.
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element: ".*Tel Aviv \\(UTC\\+[23]\\).*"
    direction: DOWN
    centerElement: true
- assertNotVisible: ".*Honolulu.*"
- tapOn: ".*Tel Aviv \\(UTC\\+[23]\\).*"
# The picker offers the phone's own zone first: the simulator is in Honolulu,
# ten hours behind UTC. It read "Honolulu (UTC)": the offset was Intl's
# 'shortOffset' zone name, which Hermes gives as a bare "GMT" (T-011).
- extendedWaitUntil:
    visible: "Honolulu \\(UTC-10\\)"
    timeout: 10000
- takeScreenshot: 23-picker-device-in-honolulu
# Offsets are today's: New York's, written out as UTC-5 all year, is UTC-4
# through its summer (the seed works out which, NEW_YORK_OFFSET_LABEL).
- scrollUntilVisible:
    element: "New York \\(${NEW_YORK_OFFSET_LABEL}\\)"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element: "Tokyo \\(UTC\\+9\\)"
    direction: DOWN
    centerElement: true
- tapOn: "Tokyo \\(UTC\\+9\\)"
# The picker closes on the saved choice, and the profile names it.
- extendedWaitUntil:
    notVisible: "Honolulu \\(.*\\)"
    timeout: 10000
- assertVisible: ".*Tokyo \\(UTC\\+9\\).*"
# The calendar follows: Night watch at Tokyo's time — today's or tomorrow's,
# by the hour the flow runs at.
- tapOn:
    id: tab-calendar
- scrollUntilVisible:
    element: "(?s)(?=.*Night watch)(?=.*${WATCH_TOKYO_TIME}).*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: 23-calendar-in-tokyo
# And so does the project's page, still open where it was left: Night watch
# at Tokyo's time, not the 02:00 it was opened with.
- tapOn:
    id: tab-projects
- scrollUntilVisible:
    element: "(?s)(?=.*Night watch).*"
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: "(?s)(?=.*Night watch)(?=.*${WATCH_TOKYO_TIME} — ).*"
    timeout: 10000
- assertNotVisible: "(?s)(?=.*Night watch)(?=.*02:00 — 03:00).*"
- takeScreenshot: 23-project-in-tokyo
# The notifications switch says what this phone will get (cause fix 20: GC02,
# GC01). A simulator cannot receive push at all, which is the one refusal a
# flow can bring about: the permission prompt and the server's answer to a
# token are below what the simulator does. Here, not in a flow of its own: a
# sign-in of its own cost the full run the minute it did not have.
#
# The old switch showed the account's setting alone — on for every account —
# though nothing on this phone could be notified. Turning it on again saved the
# setting, ignored that registering had come to nothing and buzzed success; a
# refused permission and a lost connection went the same way. Its first fix
# read off without the permission, so on such a phone the account's setting
# could not be turned off at all. Now the switch is the account's setting, and
# what this phone came to is said below it, the same after a tab change.
# The profile is still scrolled to the timezone, below the switch.
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-notifications
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: profile-notifications
    checked: true
- assertVisible:
    id: profile-notifications-device
    text: ".*This device cannot receive push notifications.*"
- takeScreenshot: 23-switch-before
# Another tab and back: still said.
- tapOn:
    id: tab-calendar
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-notifications-device
    text: ".*This device cannot receive push notifications.*"
# Off, though nothing was ever allowed here: saved, nothing left to say.
- tapOn:
    id: profile-notifications
- extendedWaitUntil:
    notVisible:
      id: profile-notifications-device
    timeout: 10000
- assertVisible:
    id: profile-notifications
    checked: false
# On: the phone says it cannot, and nothing reads as done.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-notifications
      SEE: ".*This device cannot receive push notifications.*"
      WAIT_MS: "10000"
- takeScreenshot: 23-cannot-receive
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: ".*This device cannot receive push notifications.*"
    timeout: 10000
- assertVisible:
    id: profile-notifications
    checked: false
- takeScreenshot: 23-switch-after
