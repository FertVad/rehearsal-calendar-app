# An admin's count in a rehearsal's details comes whichever answers first,
# the participants or the projects (cause fix 22: DD01, review). Olga is
# the admin of Estate Ball and not on its "Ball rehearsal", so her calendar
# has nothing to give the count; she opens it by link while her projects are
# still on their way. The participants come first, when nothing yet says she
# is an admin; the details dropped their count then and never asked again, so
# "0/1" did not come with the projects.
appId: ${APP_ID}
name: Details count when the projects come late
tags:
  - rehearsals
  - seen
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../subflows/sign-in-fill.yaml
    env:
      EMAIL: ${OLGA_EMAIL}
# Her projects held, the connection open, until the release below. The hold
# goes on once the form is filled, just before the tap that asks for them: a
# hold lapses a minute after it is made, and the typing before it may take
# longer — the keyboard of a cold launch drops what is typed and the email
# goes in again. Held before the typing, the sign-in of a red run (T-234)
# asked for the projects 68 s later, the hold was gone, and they came at once,
# with the count.
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: GET
      PATH: "^/api/native/projects$"
      OPEN: "1"
- runFlow:
    file: ../subflows/sign-in-submit.yaml
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: rehearsalapp://rehearsal/${BALL_REHEARSAL}
- extendedWaitUntil:
    visible: "Ball rehearsal"
    timeout: 15000
# The participants have answered; the projects have not, so no count yet.
- extendedWaitUntil:
    visible: "Leonid Gaev.*"
    timeout: 15000
- assertNotVisible: "0/1"
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
- extendedWaitUntil:
    visible: "0/1"
    timeout: 15000
- takeScreenshot: 42-details-count-after-projects
