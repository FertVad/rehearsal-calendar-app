# Every notification, however old (cause fix 21: NI01). Anfisa has sixty: the
# newest fifty read, the ten before them not, the Samovar the oldest of all.
# The old screen read the newest fifty and stopped there: the unread ones were
# in the database and nowhere on screen, and with every card shown read
# "Mark all read" was hidden, though the bell still counted ten.
#
# Then fifty-one arrive while her inbox is open, the Lamp the oldest of them,
# and she pulls to refresh (review). The newest page ends above the cards
# already shown, and the old screen kept those below it with no page to come:
# the Lamp was in neither, and could not be reached.
appId: ${APP_ID}
name: Inbox older pages
tags:
  - notifications
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${ANFISA_EMAIL}
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: ".*House notice 60.*"
    timeout: 15000
# Down to the oldest: the next pages come as the list ends.
- scrollUntilVisible:
    element: ".*Samovar polished.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 33-oldest-notification
# The count is the whole inbox's, not the first page's.
- assertVisible: "Mark all read"
- tapOn: "Mark all read"
- extendedWaitUntil:
    notVisible: "Mark all read"
    timeout: 10000
- takeScreenshot: 33-all-read
# A page's worth and one more, the Lamp before the fifty.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${ANFISA_EMAIL}
      COUNT: "1"
      TITLE: "Lamp lit late"
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${ANFISA_EMAIL}
      COUNT: "50"
      TITLE: "Night notice"
- scrollUntilVisible:
    element: ".*House notice 60.*"
    direction: UP
    timeout: 60000
- swipe:
    start: 50%, 25%
    end: 50%, 75%
- extendedWaitUntil:
    visible: ".*Night notice 50.*"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Lamp lit late 1.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 33-between-pages
