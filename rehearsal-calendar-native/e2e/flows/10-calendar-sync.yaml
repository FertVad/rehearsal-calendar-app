# The calendar sync settings, with calendar access and without it (T-004).
# Anna Director opens Profile → Calendar Sync on a phone that has refused the
# app the calendar: the screen opens, says access is required and offers it;
# asked again, iOS does not ask, and the screen says access was denied rather
# than failing. Back in the profile, the app is still there. Then the phone
# gives the access, and the same screen shows its switch and the calendars.
#
# Maestro sets the permission at launch (`permissions`), so the flow launches
# the app itself and signs in through the form. The sync screen has no test
# ids but the switch's; the rest is found by its English labels.
appId: ${APP_ID}
name: Calendar sync settings, with and without calendar access
tags:
  - calendar
  - profile
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      calendar: deny
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element: ".*Calendar Sync.*"
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Calendar Sync.*"
      SEE: "Calendar access required"
      WAIT_MS: 10000
# No access: the screen says so and offers it; there is nothing to switch.
- assertVisible: "Grant Access"
- assertNotVisible:
    id: calendar-sync-toggle
- takeScreenshot: 10-calendar-sync-no-access
# Refused already, so iOS does not ask again: the app says access was denied.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Grant Access"
      SEE: "Access Denied"
      WAIT_MS: 10000
- assertVisible: "Calendar access is required to use this feature"
- takeScreenshot: 10-calendar-sync-access-denied
- tapOn: "OK"
# Still the same screen, still without access.
- extendedWaitUntil:
    visible: "Calendar access required"
    timeout: 5000
- assertNotVisible:
    id: calendar-sync-toggle
# Back to the profile (the sync screen's title is "Calendar Sync" too).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Back"
      SEE: ".*Week starts on.*"
      WAIT_MS: 10000
- assertNotVisible: "Calendar access required"
# The phone gives the access; the session stays, so no sign-in.
- launchApp:
    permissions:
      calendar: allow
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 30000
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element: ".*Calendar Sync.*"
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Calendar Sync.*"
      SEE: "Auto Sync"
      WAIT_MS: 15000
# The switch and the calendar to sync with are on screen.
- assertVisible:
    id: calendar-sync-toggle
- assertVisible: ".*Apple Calendar.*"
- assertNotVisible: "Calendar access required"
- takeScreenshot: 10-calendar-sync-with-access
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Back"
      SEE: ".*Week starts on.*"
      WAIT_MS: 10000
- assertNotVisible: "Auto Sync"
