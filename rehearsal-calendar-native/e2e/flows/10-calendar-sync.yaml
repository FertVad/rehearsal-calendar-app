# The calendar sync settings, with calendar access and without it (T-004).
# Anna Director opens Profile → Calendar Sync on a phone that has refused the
# app the calendar: the screen opens, says access is required and offers it;
# asked again, iOS does not ask, and the screen says access was denied rather
# than failing. Back in the profile, the app is still there. Then the phone
# gives the access, and the same screen shows its switch and the calendars.
#
# Maestro sets the permission at launch (`permissions`), so the flow launches
# the app itself and signs in through the form. The sync screen has no test
# ids but the switch's and its top line's; the rest is found by its English
# labels.
appId: ${APP_ID}
name: Calendar sync settings, with and without calendar access
tags:
  - calendar
  - profile
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      calendar: deny
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
# The tab is there before the app takes taps: a tap can go unanswered, so it
# is tapped until the profile is on screen (14.11, the tab stayed on Calendar).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element: ".*Calendar Sync.*"
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Calendar Sync.*"
      SEE: "Calendar access required"
      WAIT_MS: 10000
# One line at the top says what sync does, with access or without (T-024):
# only the hours come in, never what the events are, as onboarding promises.
- assertVisible:
    id: calendar-sync-explanation
    text: ".*only the hours you are busy come back from it — never the details of your events.*"
# No access: the screen says so and offers it; there is nothing to switch.
- assertVisible: "Grant Access"
- assertNotVisible:
    id: calendar-sync-toggle
- takeScreenshot: 10-calendar-sync-no-access
# Refused already, so iOS does not ask again: the app says access was denied.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Grant Access"
      SEE: "Access Denied"
      WAIT_MS: 10000
# The onboarding's string, changed with it (T-417): "to use this feature"
# whole, the sentence with its full stop (HIG, Alerts).
- assertVisible: "Calendar access is required to\u00a0use\u00a0this\u00a0feature\\."
- takeScreenshot: 10-calendar-sync-access-denied
- tapOn: "OK"
# Still the same screen, still without access.
- extendedWaitUntil:
    visible: "Calendar access required"
    timeout: 5000
- assertNotVisible:
    id: calendar-sync-toggle
# Back to the profile (the sync screen's title is "Calendar Sync" too).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: header-back
      SEE: ".*Start Week On.*"
      WAIT_MS: 10000
- assertNotVisible: "Calendar access required"
# The phone gives the access; the session stays, so no sign-in.
- launchApp:
    permissions:
      calendar: allow
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 30000
# Just launched: the same unanswered tap as above, on the same tab.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element: ".*Calendar Sync.*"
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Calendar Sync.*"
      SEE: "Auto Sync"
      WAIT_MS: 15000
# The switch and the calendar to sync with are on screen, under the same line.
- assertVisible:
    id: calendar-sync-explanation
- assertVisible:
    id: calendar-sync-toggle
- assertVisible: ".*Apple Calendar.*"
- assertNotVisible: "Calendar access required"
- takeScreenshot: 10-calendar-sync-with-access
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: header-back
      SEE: ".*Start Week On.*"
      WAIT_MS: 10000
- assertNotVisible: "Auto Sync"
