# A rehearsal planned in the planner is saved with the people the planner
# planned it for, not the whole project (DP02, cause fix 7).
appId: ${APP_ID}
name: From the planner to a rehearsal
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
- tapOn: "Planner, tab.*"
- tapOn:
    id: planner-project
- tapOn: "Hamlet"
- tapOn: "Expand.*"
# Start from everyone and take two out. What is selected on arrival is
# whatever the previous project had — DP01, cause fix 8 — so it is not relied
# on; and none selected reads "All members", since it means everyone.
- repeat:
    while:
      notVisible: "4 of 4 selected"
    times: 2
    commands:
      - tapOn:
          id: members-toggle-all
- assertVisible: "4 of 4 selected"
- tapOn: ".*Ophelia Bright"
- tapOn: ".*Horatio Friend"
- assertVisible: "2 of 4 selected"
# The first slot offered, whichever day it falls on, brought to the middle of
# the screen — under the tab bar or still moving, a tap misses it.
- scrollUntilVisible:
    element: "\\+ Add"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "\\+ Add"
    index: 0
- extendedWaitUntil:
    visible: "Selected: 2 of 4"
    timeout: 15000
- tapOn: "e.g. Act II run-through"
- inputText: "Duel scene"
- scrollUntilVisible:
    element:
      id: rehearsal-submit
    direction: DOWN
- tapOn:
    id: rehearsal-submit
- extendedWaitUntil:
    visible: "Rehearsal created"
    timeout: 15000
- tapOn: "OK"
- tapOn: "Calendar, tab.*"
- scrollUntilVisible:
    element: ".*Duel scene.*"
    direction: DOWN
- tapOn: ".*Duel scene.*"
- extendedWaitUntil:
    visible: "Participants"
    timeout: 15000
- assertVisible: "0/2"
- assertVisible: "Anna Director.*"
- assertVisible: "Hamlet Dane"
- assertNotVisible: "Ophelia Bright"
- assertNotVisible: "Horatio Friend"
- takeScreenshot: 06-rehearsal-from-planner
