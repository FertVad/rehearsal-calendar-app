      id: availability-weekend-default
      text: "(?-i)Ocupado por defecto: cámbialo como cualquier otro día\\. Para desactivarlo en todos los fines de semana: Perfil\u00a0→\u00a0Fines\u00a0de\u00a0semana\u00a0ocupados\\."
    timeout: 10000
- takeScreenshot: 105-weekend-default-in-editor-es
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-weekends-busy
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      id: profile-weekends-busy
