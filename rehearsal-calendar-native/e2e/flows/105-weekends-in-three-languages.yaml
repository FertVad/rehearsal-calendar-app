    timeout: 10000
- takeScreenshot: 105-weekend-default-in-editor-de
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    notVisible:
      id: availability-legend
    timeout: 10000
- tapOn:
    id: tab-profile
- scrollUntilVisible:
