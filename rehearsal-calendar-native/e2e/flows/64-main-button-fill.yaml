# The main buttons are filled flat with #9333EA, white on it 5.38:1 (T-027).
# They were #A855F7 — 3.96:1, under the 4.5:1 text below 17 pt needs — the
# bottom bar's button flat, "Sign in" a gradient from it to #9333EA. Each
# button is one element, so its fill is looked for on the screenshot: nothing
# within a few shades of #A855F7 on it. "Sign in", filled in; the rehearsal
# form's "Create"; the availability editor's "Save", once a day has a change.
# Nothing is saved.
appId: ${APP_ID}
name: "Main buttons are filled with #9333EA"
tags:
  - auth
  - rehearsals
  - availability
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 60000
# "Sign in" is on only with both fields filled; off, it is half its colour.
# Typed and checked as sign-in-form.yaml does: the first keyboard is slow.
# Each button is looked at left of its label: the label's anti-aliased edge,
# white over #9333EA, passes within a few shades of #A855F7 too.
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-email
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${ARKADINA_EMAIL}
      - assertVisible:
          id: login-email
          text: ${ARKADINA_EMAIL}
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-password
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${PASSWORD}
      - assertVisible:
          id: login-password
          text: ${'•'.repeat(PASSWORD.length)}
- hideKeyboard
- assertVisible:
    id: login-submit
    enabled: true
- waitForAnimationToEnd
- takeScreenshot: 64-sign-in
- runScript:
    file: ../scripts/no-ink.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 64-sign-in
      COLOUR: "#a855f7"
      TOLERANCE: "12"
      LEFT: "0.07"
      RIGHT: "0.35"
      TOP: "0.53"
      BOTTOM: "0.58"
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000
# The rehearsal form: "Create" in the bottom bar, on once the day's
# availability is in.
- tapOn:
    id: tab-create
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Create Rehearsal"
      SEE: "Add Rehearsal"
      WAIT_MS: "10000"
- extendedWaitUntil:
    visible:
      id: rehearsal-submit
      enabled: true
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 64-rehearsal-form
- runScript:
    file: ../scripts/no-ink.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 64-rehearsal-form
      COLOUR: "#a855f7"
      TOLERANCE: "12"
      LEFT: "0.07"
      RIGHT: "0.28"
      TOP: "0.90"
      BOTTOM: "0.945"
- tapOn:
    id: header-cancel
- extendedWaitUntil:
    notVisible:
      id: header-cancel
    timeout: 10000
# Availability: today picked, then busy all day — or free, if it already
# was busy — so "Save" is on.
- tapOn:
    id: tab-create
- tapOn: "Mark Busy"
- extendedWaitUntil:
    visible:
      id: day-${TODAY_DAY}
      below:
        id: availability-legend
    timeout: 30000
- tapOn:
    id: day-${TODAY_DAY}
- extendedWaitUntil:
    visible:
      id: availability-save
    timeout: 10000
- tapOn:
    id: mode-busy
- runFlow:
    when:
      visible:
        id: availability-save
        enabled: false
    commands:
      - tapOn:
          id: mode-free
- assertVisible:
    id: availability-save
    enabled: true
- waitForAnimationToEnd
- takeScreenshot: 64-availability
- runScript:
    file: ../scripts/no-ink.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 64-availability
      COLOUR: "#a855f7"
      TOLERANCE: "12"
      LEFT: "0.07"
      RIGHT: "0.28"
      TOP: "0.90"
      BOTTOM: "0.945"
