# A new rehearsal and being put on one read right in Spanish, German and
# Russian (T-248). Native speakers found the server's words wrong: Spanish
# "Escena del balcón programado mañana" (scheduled tomorrow, not for
# tomorrow, and the participle agreeing with a feminine title as if it were
# masculine), German "Fechtszene angesetzt morgen um 18:00" (the participle
# goes last), Russian "Прогон назначена" (a masculine title, a feminine
# participle). The inbox shows the server's body as it is.
#
# Each reader is told of her rehearsal tomorrow at 18:00 as a save tells them,
# by the server's own notifyRehearsalCreated and notifyAddedToRehearsal, in
# her account's language (the seed: Laurencia es, Gretchen de, Katerina ru),
# and reads both in her inbox. By the time this runs "tomorrow" may be a date.
#
# And nothing agrees with what the server cannot know (T-251): a cancelled
# rehearsal agrees with "rehearsal", not with its title ("Прогон отменена",
# "Escena del balcón cancelado"); a woman who joins or marks a rehearsal seen
# is no "присоединился", "откликнулся"; a woman reading of her own new role or
# removal is no "administrador", "eliminado", "Administrator"; and "Вы теперь
# администратором" had no verb. Each is sent by the server's own function
# before the two above, so they are below them in the inbox, and only the
# notice is sent: the rehearsal, the role and the membership stay as they are.
appId: ${APP_ID}
name: Rehearsal notices read right in Spanish, German and Russian
tags:
  - notifications
  - language
---
# Spanish (T-251): cancelled, a role given, removed.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: rehearsal_deleted
      REHEARSAL: Escena del balcón
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: role_changed
      PROJECT: Fuenteovejuna
      ROLE: admin
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: member_removed
      PROJECT: Fuenteovejuna
# Spanish: "programado para", and the participle agreeing with "Ensayo".
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: rehearsal_created
      REHEARSAL: Escena del balcón
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: added_to_rehearsal
      REHEARSAL: Escena del balcón
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${LAURENCIA_EMAIL}
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Notificaciones"
      SEE: "(Marcar todas|Todavía nada)"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible: ".*Te han añadido a un ensayo.*Fuenteovejuna: Ensayo «Escena del balcón» programado para (mañana|el .*) a las 18:00 en Patio.*"
    timeout: 15000
- assertVisible: ".*Nuevo ensayo.*Fuenteovejuna: Ensayo «Escena del balcón» programado para (mañana|el .*) a las 18:00.*"
- takeScreenshot: 86-spanish
- scrollUntilVisible:
    element: ".*Ya no estás en el proyecto.*Ya no formas parte del proyecto Fuenteovejuna.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Cambio de rol.*Ahora administras Fuenteovejuna.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Ensayo cancelado.*Fuenteovejuna: Ensayo «Escena del balcón» cancelado.*"
    direction: DOWN
- takeScreenshot: 86-spanish-cancelled-role-removed
# German (T-251): a role given, a verb rather than "Administrator".
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${GRETCHEN_EMAIL}
      TYPE: role_changed
      PROJECT: Faust
      ROLE: admin
# German: the participle last, the place after it.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${GRETCHEN_EMAIL}
      TYPE: rehearsal_created
      REHEARSAL: Fechtszene
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${GRETCHEN_EMAIL}
      TYPE: added_to_rehearsal
      REHEARSAL: Fechtszene
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${GRETCHEN_EMAIL}
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Mitteilungen"
      SEE: "(Alle als gelesen|Noch nichts)"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible: ".*Du wurdest zu einer Probe hinzugefügt.*Faust: Fechtszene (morgen|am .*) um 18:00 angesetzt, Ort: Probebühne.*"
    timeout: 15000
- assertVisible: ".*Neue Probe.*Faust: Fechtszene (morgen|am .*) um 18:00 angesetzt.*"
- takeScreenshot: 86-german
- scrollUntilVisible:
    element: ".*Rolle geändert.*Du verwaltest jetzt Faust.*"
    direction: DOWN
- takeScreenshot: 86-german-role
# Russian (T-251): cancelled, a woman who joins, a woman who has seen it, a
# role given.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: rehearsal_deleted
      REHEARSAL: Прогон
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: member_joined
      PROJECT: Гроза
      MEMBER: Марфа Кабанова
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: member_response
      REHEARSAL: Прогон
      MEMBER: Марфа Кабанова
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: role_changed
      PROJECT: Гроза
      ROLE: admin
# Russian: the participle agreeing with "Репетиция", whatever the title.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: rehearsal_created
      REHEARSAL: Прогон
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: added_to_rehearsal
      REHEARSAL: Прогон
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${KATERINA_EMAIL}
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Уведомления"
      SEE: "(Отметить все|Пока тихо)"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible: ".*Вас добавили в репетицию.*Гроза: Репетиция «Прогон» назначена (завтра|.*) в 18:00, место: Малый зал.*"
    timeout: 15000
- assertVisible: ".*Новая репетиция.*Гроза: Репетиция «Прогон» назначена (завтра|.*) в 18:00.*"
- takeScreenshot: 86-russian
- scrollUntilVisible:
    element: ".*Изменение роли.*Теперь вы администратор проекта Гроза.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Репетиция просмотрена.*Марфа Кабанова в курсе: «Прогон» \\((завтра|.*) в 18:00\\), Гроза.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Новый участник.*Марфа Кабанова теперь в проекте Гроза.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Отменена репетиция.*Гроза: Репетиция «Прогон» отменена.*"
    direction: DOWN
- takeScreenshot: 86-russian-cancelled-joined-seen-role
