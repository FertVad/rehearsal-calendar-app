# 19:00"). Sent first, so it is the lowest card.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${KATERINA_EMAIL}
      TYPE: rehearsal_updated
      REHEARSAL: Сцена на бульваре
      CHANGE: end
