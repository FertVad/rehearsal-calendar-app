# A new rehearsal and being put on one read right in Spanish, German and
# Russian (T-248). Native speakers found the server's words wrong: Spanish
# "Escena del balcón programado mañana" (scheduled tomorrow, not for
# tomorrow, and the participle agreeing with a feminine title as if it were
# masculine), German "Fechtszene angesetzt morgen um 18:00" (the participle
# goes last), Russian "Прогон назначена" (a masculine title, a feminine
# participle). The inbox shows the server's body as it is.
#
# Each reader is told of her rehearsal tomorrow at 18:00 as a save tells them,
# by the server's own notifyRehearsalCreated and notifyAddedToRehearsal, in
# her account's language (the seed: Laurencia es, Gretchen de, Katerina ru),
# and reads both in her inbox. By the time this runs "tomorrow" may be a date.
#
# And nothing agrees with what the server cannot know (T-251): a cancelled
# rehearsal agrees with "rehearsal", not with its title ("Прогон отменена",
# "Escena del balcón cancelado"); a woman who joins or marks a rehearsal seen
# is no "присоединился", "откликнулся", and a "seen" reads seen in every
# language ("в курсе", "ha visto", "gesehen"), not "responded"; a woman reading of her own new role or
# removal is no "administrador", "eliminado", "Administrator"; and "Вы теперь
# администратором" had no verb. Each is sent by the server's own function
# before the two above, so they are below them in the inbox, and only the
# notice is sent: the rehearsal, the role and the membership stay as they are.
#
# And every card says all of it (T-252): the inbox cut title and text at the
# second line, "… programado para mañana a las 1…", "en Fuenteo…", and a tap
# opens the rehearsal, not the text. Maestro reads a label whole however much
# of it is drawn, so the "…" is looked for on each shot (no-ellipsis.js), over
# the cards' text, right of their icons. The longest the server sends comes
# last, on top: Spanish, "added", on a date and with a long place.
#
# And a move says where to (T-250), as the landing page says it: "Escena del
# balcón, pasa a mañana a las 18:00", "Fechtszene – verlegt auf morgen,
# 18:00", "Прогон — теперь завтра в 18:00" — not "…, mañana a las 18:00 —
# fecha/hora". Sent first, so it is the lowest card. And a longer rehearsal is
# no moved one: only its end changed, "Сцена на бульваре, завтра в 19:00 —
# теперь до 22:00", not "— теперь завтра в 19:00". Sent before the move.
#
# And as the native speakers of T-256 read them. Russian: «назначена на
# завтра» (without «на», «назначена сегодня» read as when it was set), «Вас
# позвали на репетицию», a project's name in quotes, a «seen» in the order of
# the others, «Прогон, завтра в 18:00 — Марфа Кабанова в курсе», and a
# cancelled one says which: «Репетиция «Прогон» на завтра в 18:00 отменена».
# Spanish: the place after «Lugar:», no article to guess; a cancelled one
# «Cancelado el ensayo «…» previsto para mañana a las 18:00». German: «Probe
# „Fechtszene“», the title no longer running into the date; «für eine Probe
# eingeteilt»; «Du verwaltest jetzt das Projekt „Faust“», the case on
# «Projekt»; «hat die Probe … als gesehen markiert», not watched it. Clearing
# the inbox is asked and left, «¿Borrar todas las notificaciones?» / «Borrar
# todo», «Alle Mitteilungen löschen?» / «Alle löschen», not "Vaciar", "leeren".
# Each card
# is found by what both wordings share, its words checked and the flow goes
# on; it fails at the end naming every one that was wrong.
appId: ${APP_ID}
name: Rehearsal notices read right in Spanish, German and Russian
tags:
  - notifications
  - language
---
- evalScript: ${output.wrong = ''}
# Spanish (T-250): moved, said as where to.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: rehearsal_updated
      REHEARSAL: Escena del balcón
      CHANGE: datetime
# Spanish (T-251): seen, cancelled, a role given, removed.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: member_response
      REHEARSAL: Escena del balcón
      MEMBER: Jacinta Labradora
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: rehearsal_deleted
      REHEARSAL: Escena del balcón
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: role_changed
      PROJECT: Fuenteovejuna
      ROLE: admin
- runScript:
