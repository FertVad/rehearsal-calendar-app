# The longest (T-252): in five days, so on its date, and a long place.
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${LAURENCIA_EMAIL}
      TYPE: added_to_rehearsal
      REHEARSAL: Escena del comendador
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${LAURENCIA_EMAIL}
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Notificaciones"
      SEE: "(Marcar como leídas|Marcar todas|Todavía nada)"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible: ".*Te han añadido a un ensayo.*Fuenteovejuna: Ensayo «Escena del comendador» programado para el .* a las 18:00.*Corral de comedias de Almagro.*"
    timeout: 15000
- runFlow:
    when:
      notVisible: ".*Te han añadido a un ensayo.*Fuenteovejuna: Ensayo «Escena del comendador» programado para el [a-záé]+ \\d+ de [a-z]+ a las 18:00\\. Lugar: Corral de comedias de Almagro.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: added, el martes 6 de octubre and Lugar: | '}"
- runFlow:
    when:
      notVisible: ".*Te han añadido a un ensayo.*Fuenteovejuna: Ensayo «Escena del balcón» programado para (mañana|el .*) a las 18:00\\. Lugar: Patio.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: added, Lugar: | '}"
- assertVisible: ".*Nuevo ensayo.*Fuenteovejuna: Ensayo «Escena del balcón» programado para (mañana|el .*) a las 18:00.*"
- takeScreenshot: 86-spanish
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 86-spanish
      LEFT: "0.18"
      RIGHT: "0.9"
      TOP: "0.12"
      BOTTOM: "1"
- scrollUntilVisible:
    element: ".*Ya no estás en el proyecto.*Ya no formas parte del proyecto Fuenteovejuna.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Cambio de rol.*Ahora administras Fuenteovejuna.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Ensayo cancelado.*Fuenteovejuna: .*«Escena del balcón».*"
    direction: DOWN
- runFlow:
    when:
      notVisible: ".*Ensayo cancelado.*Fuenteovejuna: Cancelado el ensayo «Escena del balcón» previsto para (mañana|el .*) a las 18:00.*"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: cancelled, previsto para when | '}"
- scrollUntilVisible:
    element: ".*Ensayo visto.*Jacinta Labradora ha visto «Escena del balcón» \\((mañana|el .*) a las 18:00\\) en Fuenteovejuna.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Ensayo actualizado.*Fuenteovejuna: Escena del balcón, pasa (a mañana|al .*) a las 18:00.*"
    direction: DOWN
- takeScreenshot: 86-spanish-cancelled-role-removed-seen
- runScript:
    file: ../scripts/no-ellipsis.js
    env:
      MAIL_URL: ${MAIL_URL}
      SHOT: 86-spanish-cancelled-role-removed-seen
      LEFT: "0.18"
      RIGHT: "0.9"
      TOP: "0.12"
      BOTTOM: "1"
# Clearing the inbox, asked and left (T-256): "Borrar todo", "¿Borrar todas las
# notificaciones?", not "Vaciar". The bin's label is the alert's button.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "(Borrar todo|Vaciar)"
      SEE: "¿(Borrar todas las|Vaciar las) notificaciones\\?"
      WAIT_MS: "10000"
- takeScreenshot: 86-spanish-clear-all
- runFlow:
    when:
      notVisible: "¿Borrar todas las notificaciones\\?"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: ¿Borrar todas las notificaciones?, not Vaciar | '}"
- runFlow:
    when:
      notVisible:
        text: "Borrar todo"
        rightOf: "Cancelar"
    commands:
      - evalScript: "${output.wrong = output.wrong + 'es: Borrar todo, not Vaciar | '}"
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible: "¿(Borrar todas las|Vaciar las) notificaciones\\?"
    timeout: 10000
# German (T-250): moved, "verlegt auf".
- runScript:
    file: ../scripts/notify.js
    env:
      MAIL_URL: ${MAIL_URL}
      EMAIL: ${GRETCHEN_EMAIL}
      TYPE: rehearsal_updated
      REHEARSAL: Fechtszene
      CHANGE: datetime
# German (T-251): seen, not "reagiert"; a role given, a verb rather than
