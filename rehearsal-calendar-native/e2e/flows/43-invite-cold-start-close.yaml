# An invitation the app was launched by can be turned down: its Cancel, and
# Close on one that does not exist, go back to the calendar (T-003 review).
# Antonio has been through onboarding and is in no project; he never joins.
#
# It found the invitation staying on screen. Each stage has a navigation
# container of its own, so the app's is mounted afresh after signing in, and a
# fresh container builds its first state from the link the app was launched
# by — the invitation alone, with nothing under it for Cancel to go back to.
# The links now open over the calendar (navigation/linking.ts, linking.test),
# and the launch link only once: signing out and in again does not bring the
# invitation back (launchLink.test).
# The other invite flows open their link in an app already running.
#
# The taps the flow waits on go through tap-and-see.yaml: the simulator lost
# the one on Close, the invitation stayed, and the flow failed waiting for the
# calendar (T-217; docs/e2e.md, "A lost tap").
appId: ${APP_ID}
name: Invite link at a cold start, turned down
tags:
  - invite
  - auth
---
# Installed fresh and closed: the link is what launches it.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 60000
- stopApp
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: rehearsalapp://invite/${TWELFTH_INVITE}
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${ANTONIO_EMAIL}
- extendedWaitUntil:
    visible:
      id: join-project-name
      text: "Twelfth Night"
    timeout: 20000
- takeScreenshot: 43-invite-cold-start
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Cancel"
      GONE: "Project Invitation"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 15000
- assertNotVisible:
    id: join-project-name
- takeScreenshot: 43-invite-cancelled
# Signed out and in again without opening a link: the invitation turned down
# stays turned down. Each sign-in mounts the app's container afresh, and each
# one read the launch link again (navigation/linking.ts, launchLink.test).
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Week starts on.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-logout
      GONE: "Sign Out"
      WAIT_MS: "10000"
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${ANTONIO_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 20000
# Given the time an invitation takes to open, to be sure none does.
- extendedWaitUntil:
    visible:
      id: join-project-name
    timeout: 5000
    optional: true
- assertNotVisible:
    id: join-project-name
- takeScreenshot: 43-invite-not-again
# Closed again, still signed in, and launched by an invite nobody issued.
- stopApp
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: rehearsalapp://invite/22222222
- extendedWaitUntil:
    visible: "Invitation not found"
    timeout: 30000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: "Close"
      GONE: "Invitation not found"
      WAIT_MS: "15000"
- extendedWaitUntil:
    visible:
      id: calendar-today
    timeout: 15000
- assertNotVisible: "Invitation not found"
- takeScreenshot: 43-invite-closed
