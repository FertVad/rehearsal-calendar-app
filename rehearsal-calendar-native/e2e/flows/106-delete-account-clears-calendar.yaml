# Deleting the account takes the exported rehearsals out of this iPhone's
# calendar (T-409). They used to stay there for good: the server's record of
# which events are the app's went with the account, and nothing could find
# them afterwards. Now the deletion removes them first, as "Remove Exported
# Rehearsals" does (T-270), and says what it could not.
#
# Vasily Zhadov exports his three rehearsals of «A Profitable Position» to the
# simulator's calendar, which will not let "Office scene" go — as iOS refuses
# the delete of an event a subscribed calendar owns (e2e/device/expo-calendar.js).
# The confirmation says this iPhone's calendar is cleared and other devices'
# are not. The account is deleted all the same, and the alert after it says
# the one event that stayed and how to delete it by hand: the other two went.
# The count is the removal's own, as flow 92 reads "Remove Exported
# Rehearsals"; on the old code nothing was removed and nothing said.
appId: ${APP_ID}
name: Deleting the account takes the exported rehearsals out of the calendar
tags:
  - calendar
  - profile
  - auth
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      rehearslyCalendarRefusesDelete: "Office scene"
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${ZHADOV_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
    timeout: 30000

# The export: his three rehearsals into the phone's calendar.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-profile
      SEE: ".*Language, English.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-calendar-sync
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-calendar-sync
- tapOn:
    text: "Grant Access"
    optional: true
- tapOn:
    text: "Allow Full Access"
    optional: true
- extendedWaitUntil:
    visible: ".*Apple Calendar.*"
    timeout: 15000
# Taken once more if the simulator lost it (T-207); a second tap only turns
# sync on again.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Apple Calendar.*"
      SEE: ".*Sync Now.*"
      WAIT_MS: "10000"
- tapOn:
    id: calendar-sync-run
- extendedWaitUntil:
    visible: "(?s).*Exported rehearsals: 3.*"
    timeout: 30000
- takeScreenshot: 106-exported
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "(?s).*Exported rehearsals: 3.*"
    timeout: 10000

# The deletion: asked first, with what happens to this iPhone's calendar.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: header-back
      SEE: ".*Start Week On.*"
      WAIT_MS: "10000"
- scrollUntilVisible:
    element:
      id: profile-delete-account
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: profile-delete-account
      SEE: "Delete Account\\?"
      WAIT_MS: "10000"
- assertVisible:
    id: delete-account-calendar
    text: "Rehearsals the app added to this iPhone’s calendar will be removed from it\\. On your other devices they will stay\\."
- waitForAnimationToEnd
- takeScreenshot: 106-question
- tapOn: "Yes, Delete"
- extendedWaitUntil:
    visible: "Account deleted"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 106-deleted
# "Finale" and "Tavern" went; "Office scene" stayed, and he is told so — under
# the line on his project, which went with the account, in one message.
- assertVisible: "(?s).*1 rehearsal could not be removed from this iPhone’s calendar\\. You can delete it yourself in the Calendar app: its title begins with the project’s name\\..*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 15000
