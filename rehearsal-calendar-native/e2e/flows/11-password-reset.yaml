# A forgotten password is reset with the code from the email, and the new one
# signs in (R3: A01, T-130). King Lear asks for a code from the sign-in
# screen; the local server mails it to the e2e mailbox, the flow reads it there
# like someone reading their mail, and sets a new password with it. The reset
# signs him in; then, from a fresh install, the new password does too. Before
# T-130 the sign-in screen had no way to reset a password at all. He is in no
# other flow.
appId: ${APP_ID}
name: Password reset by emailed code
tags:
  - auth
env:
  NEW_PASSWORD: lear-new-password
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-forgot-password
    timeout: 60000
# The three taps the flow then waits on go through tap-and-see: the simulator
# drops about one tap in 250 and Maestro calls it done (docs/e2e.md, "A lost
# tap"); one red run lost "Change password and sign in" (T-209). Each may be
# taken twice: a second "Send code" within the minute sends nothing, and a
# second reset only comes when the first left the screen as it was.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: login-forgot-password
      SEE: ".*Enter the address of your account.*"
      WAIT_MS: 10000
# The first keyboard after a cold launch is slow (sign-in-form.yaml).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: reset-email
      - waitForAnimationToEnd:
          timeout: 3000
      - eraseText
      - inputText: ${LEAR_EMAIL}
      - assertVisible:
          id: reset-email
          text: ${LEAR_EMAIL}
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: reset-send
      SEE: ".*a six-digit code is on its way there.*"
      WAIT_MS: 20000
- runScript:
    file: ../scripts/read-code.js
    env:
      MAIL_URL: ${MAIL_URL}
      TO: ${LEAR_EMAIL}
      NAME: resetCode
- tapOn:
    id: reset-code
- inputText: ${output.resetCode}
- assertVisible:
    id: reset-code
    text: ${output.resetCode}
- tapOn:
    id: reset-password
- inputText: ${NEW_PASSWORD}
- assertVisible:
    id: reset-password
    text: ${'•'.repeat(NEW_PASSWORD.length)}
- tapOn:
    id: reset-confirm
- inputText: ${NEW_PASSWORD}
- assertVisible:
    id: reset-confirm
    text: ${'•'.repeat(NEW_PASSWORD.length)}
- hideKeyboard
- takeScreenshot: 11-reset-code-and-password
# Either the tab bar's "+" (New Action) or iOS's offer to keep the password,
# over the whole screen, says the reset was taken.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: reset-submit
      SEE: "New Action|Not Now"
      WAIT_MS: 20000
# The offer may come after the tab bar.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 10000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
# The reset signed him in.
- extendedWaitUntil:
    visible:
      id: tab-create
    timeout: 20000
# A fresh install: the new password is the one that signs in.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${LEAR_EMAIL}
      PASSWORD: ${NEW_PASSWORD}
- extendedWaitUntil:
    visible:
      id: tab-create
    timeout: 20000
- takeScreenshot: 11-signed-in-with-new-password
