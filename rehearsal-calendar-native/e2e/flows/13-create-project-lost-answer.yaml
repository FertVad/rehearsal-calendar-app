# A create whose answer was lost, tapped again, makes one project (cause fix
# 10: B02). Macduff creates Dunsinane; the server makes the project and the
# local server loses its answer (hold-answers.js, LOSE), so the app says it
# failed. He taps Create again on the same form. The app sends the key of the
# first try (and of a third, should the second be lost too), and the server
# answers with the project it made:
# reopened, the app lists Dunsinane once. Each tap used to make a project of
# its own, and he found two.
appId: ${APP_ID}
name: A create tapped again after its answer was lost makes one project
tags:
  - projects
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MACDUFF_EMAIL}
- tapOn:
    id: tab-create
- tapOn: "Create Project"
- tapOn: "Enter name"
- inputText: "Dunsinane"
# The first create only: the server makes the project, and its connection is
# closed with no answer. No ten seconds of iOS in it: a seed that made the
# server slower than the app's timeout counted on iOS giving up, and iOS once
# waited 40 s (T-220, T-048). iOS sends a POST that lost its connection no
# second time (T-048), so the next one is the app's own.
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: POST
      PATH: "^/api/native/projects$"
      LOSE: "1"
      ONCE: "1"
- tapOn: "Create"
# No answer is said in the app's language, not axios's "Network Error"
# (T-228, requestErrorMessage).
- extendedWaitUntil:
    visible: "No connection\\. Check the internet and try again\\."
    timeout: 20000
- assertNotVisible: ".*Network Error.*"
- takeScreenshot: 13-lost-answer
- tapOn: "OK"
- tapOn: "Create"
# The first try was committed before its answer was lost, so the second is
# answered with its project at once (services/idempotency.js).
- extendedWaitUntil:
    visible: ".*Lord Macduff, Owner.*"
    timeout: 30000
# Both requests are done by now, whatever the server made of them. Reopened,
# the app lists what the server holds.
- launchApp
# A tap the simulator loses is taken once more (T-207): the run of 25.10.2026
# 21:34 lost this one, and the flow waited on the calendar for the cards.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: tab-projects
      SEE: ".*Dunsinane.*"
      WAIT_MS: 15000
# He is in no other project: every card is a Dunsinane, and there is one.
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Dunsinane.*"
    timeout: 15000
- assertNotVisible:
    id: project-card
    index: 1
- takeScreenshot: 13-one-project
