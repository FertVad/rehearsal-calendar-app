# The rehearsal form holds what is chosen in it, with the role as it is now,
# while the projects are read again behind it (T-229 review). Tybalt is an
# admin of Feud Street and Feud Ball, Gaev's.
#
# He opens the form from Feud Street's page and picks Feud Ball in it. He
# sends the app away and opens it again: the projects are read again on the
# way back, and the form stays on Feud Ball, so the rehearsal is created
# there. The form put the page's project back over his choice on each new
# list, and the rehearsal went to Feud Street.
#
# Then, with the form open on Feud Ball, Gaev takes the admin role on it away
# from another device. Back in the app the form says no project is chosen and
# Create is not offered. It held a copy of the project with the role from
# when it was chosen, and Create sent what the server refused.
appId: ${APP_ID}
name: Rehearsal form, the projects read again
tags:
  - rehearsals
  - projects
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${TYBALT_EMAIL}
- tapOn:
    id: tab-projects
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Feud Street.*"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Feud Street.*"
      SEE: ".*New rehearsal.*"
      WAIT_MS: "15000"
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: project-new-rehearsal
      SEE: "Add Rehearsal"
      WAIT_MS: "10000"
- extendedWaitUntil:
    visible:
      id: rehearsal-project
      text: ".*Feud Street.*"
    timeout: 10000
# Feud Ball, picked in the form.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: rehearsal-project
      SEE: "Select Project"
      WAIT_MS: "5000"
- waitForAnimationToEnd
- tapOn: "Feud Ball.*"
- extendedWaitUntil:
    visible:
      id: rehearsal-project
      text: ".*Feud Ball.*"
    timeout: 10000
# Away and back: the projects are read again.
- pressKey: Home
- launchApp:
    stopApp: false
- tapOn: "e.g. Act II run-through"
- inputText: "Masked dance"
- assertVisible:
    id: rehearsal-project
    text: ".*Feud Ball.*"
- takeScreenshot: 77-form-on-the-ball-after-return
- scrollUntilVisible:
    element:
      id: rehearsal-submit
    direction: DOWN
- tapOn:
    id: rehearsal-submit
- extendedWaitUntil:
    visible: "Rehearsal created"
    timeout: 15000
- tapOn: "OK"
# Back on Feud Street's page: not there, but on Feud Ball's.
- extendedWaitUntil:
    visible: ".*New rehearsal.*"
    timeout: 10000
- assertNotVisible: ".*Masked dance.*"
- takeScreenshot: 77-not-in-the-street
- tapOn: ".*My Projects"
- extendedWaitUntil:
    visible:
      id: project-card
      text: ".*Feud Ball.*"
    timeout: 10000
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP: ".*Feud Ball.*"
      SEE: ".*New rehearsal.*"
      WAIT_MS: "15000"
- scrollUntilVisible:
    element: ".*Masked dance.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 77-created-in-the-ball
# The form on Feud Ball, and the role on it taken while it is open.
- scrollUntilVisible:
    element:
      id: project-new-rehearsal
    direction: UP
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: project-new-rehearsal
      SEE: "Add Rehearsal"
      WAIT_MS: "10000"
- extendedWaitUntil:
    visible:
      id: rehearsal-project
      text: ".*Feud Ball.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: rehearsal-submit
      enabled: true
    timeout: 15000
- runScript:
    file: ../scripts/set-role.js
    env:
      API_URL: ${API_URL}
      EMAIL: ${GAEV_EMAIL}
      PASSWORD: ${PASSWORD}
      PROJECT: "Feud Ball"
      MEMBER: ${TYBALT_EMAIL}
      ROLE: member
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: rehearsal-project-error
    timeout: 15000
- assertVisible:
    id: rehearsal-submit
    enabled: false
- takeScreenshot: 77-form-without-the-role
