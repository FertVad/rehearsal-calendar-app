# What the screens before signing in say when a request fails, in the native
# speakers' words (T-256):
# - English, the mail provider down: "Emails cannot be sent right now. Try
#   again later.", not "Email is unavailable right now.";
# - Russian, no connection: «Нет связи с сервером. Проверьте интернет и
#   попробуйте ещё раз.», with its full stop;
# - Russian, an answer the app has no words for: «Что-то пошло не так.
#   Попробуйте ещё раз.», with its full stop.
#
# The stand's server has no mail provider to lose, so the reset's request is
# answered as the server answers it then — 503, EMAIL_UNAVAILABLE
# (passwordReset.js) — and not handled (hold-answers.js, FAIL). The screens
# before signing in speak the language of the last account signed in on the
# phone: Glumov, whose account speaks Russian, signs in and out, and his
# sign-in then goes nowhere (DROP), and then is refused with a 400 and no code,
# as a proxy in front of the server refuses (FAIL). Each text is checked where
# it shows and the flow goes on, so a run on the old words names every one; it
# fails at the end if any was wrong.
appId: ${APP_ID}
name: Sign-in failures read right
tags:
  - auth
  - language
  - network
---
- evalScript: ${output.wrong = ''}
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-forgot-password
    timeout: 60000

# English: a code asked for while the mail is down.
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: login-forgot-password
      SEE: ".*Enter your account’s email address.*"
      WAIT_MS: "10000"
# The first keyboard after a cold launch is slow (sign-in-form.yaml).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: reset-email
      - waitForAnimationToEnd:
          timeout: 3000
      - eraseText
      - inputText: ${GLUMOV_EMAIL}
      - assertVisible:
          id: reset-email
          text: ${GLUMOV_EMAIL}
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: POST
      PATH: "^/api/auth/password-reset/request$"
      FAIL: "503"
      CODE: EMAIL_UNAVAILABLE
      ERROR: Email is not available right now
- runFlow:
    file: ../subflows/tap-and-see.yaml
    env:
      TAP_ID: reset-send
      SEE: "Email.*(unavailable|cannot be sent).*"
      WAIT_MS: "15000"
- takeScreenshot: 93-email-unavailable-en
- runFlow:
    when:
      notVisible: "Emails cannot be sent right now\\. Try again later\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'en: Emails cannot be sent right now | '}"
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}

# Russian: Glumov signs in and out; the sign-in screen keeps his language.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../subflows/sign-in-form.yaml
    env:
      EMAIL: ${GLUMOV_EMAIL}
- extendedWaitUntil:
    visible:
      id: calendar-filter
      text: ".*Все проекты.*"
    timeout: 30000
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-logout
- runFlow:
    file: ../subflows/sign-in-fill.yaml
    env:
      EMAIL: ${GLUMOV_EMAIL}
# Goes nowhere: its connection closed, as when the network goes; the app's own
# second try too (api.ts), so no ONCE.
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: POST
      PATH: "^/api/auth/login$"
      DROP: "1"
# One tap: a second would be the person trying again.
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: "Нет связи с сервером.*"
    timeout: 30000
- takeScreenshot: 93-no-connection-ru
- runFlow:
    when:
      notVisible: "Нет связи с сервером\\. Проверьте интернет и попробуйте ещё раз\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: Нет связи с сервером, its full stop | '}"
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
- runScript:
    file: ../scripts/hold-answers.js
    env:
      MAIL_URL: ${MAIL_URL}
      METHOD: POST
      PATH: "^/api/auth/login$"
      FAIL: "400"
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: "Что-то пошло не так.*"
    timeout: 30000
- takeScreenshot: 93-request-failed-ru
- runFlow:
    when:
      notVisible: "Что-то пошло не так\\. Попробуйте ещё раз\\."
    commands:
      - evalScript: "${output.wrong = output.wrong + 'ru: Что-то пошло не так, its full stop | '}"
- runScript:
    file: ../scripts/release-answers.js
    env:
      MAIL_URL: ${MAIL_URL}

- evalScript: "${console.log('93 not as a native speaker writes it: ' + JSON.stringify(output.wrong))}"
- runFlow:
    when:
      true: ${output.wrong != ''}
    commands:
      - extendedWaitUntil:
          visible:
            id: words-not-as-a-native-speaker-writes-them
          timeout: 1000
