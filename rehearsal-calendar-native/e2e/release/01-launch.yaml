# The Release build — what goes to the App Store, its JS inside it, __DEV__
# false — opens on the sign-in screen from a fresh install (T-227).
# TestFlight 1.0.0 (1) did not: app.json had lost the NSReminders* keys, and
# expo-calendar's module calls EXFatal without them when it is created. In
# Release the other Expo modules were then never registered, the JS stopped at
# "Cannot find native module 'ExpoPushTokenManager'", and the screen stayed
# black (9d265da). A Debug build of the same project showed nothing of it.
# Runs on the Release app only: e2e/run.mjs builds it for the flows in this
# folder, in the full run and when one of them is named.
appId: ${APP_ID}
name: Release opens on sign-in
tags:
  - smoke
  - release
  - auth
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 60000
- assertVisible:
    id: login-email
- takeScreenshot: release-01-sign-in
