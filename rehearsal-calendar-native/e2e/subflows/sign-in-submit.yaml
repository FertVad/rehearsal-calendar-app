# On the sign-in screen, filled in by sign-in-fill.yaml: sends it.
appId: ${APP_ID}
---
# A lost tap on "Sign In" left the form filled in and flow 59 waiting 30 s for
# a calendar that was never asked for (T-225), so it goes through
# tap-and-see.yaml too: the button leaves the screen when the app goes on to
# the calendar. Its label is in the language the screen speaks, so it is
# waited on by its id.
#
# iOS's "Save Password?" sheet, which used to follow every sign-in and hide the
# app until "Not Now" was tapped, is off on the e2e simulator (noPasswordOffer
# in e2e/run.mjs), so nothing here waits for it; flow 01 sees that it stays
# away. Maestro's driver can still end on a scene of InputUI going away - the
# keyboard's, after the typing above - which is Maestro's race and not the
# sheet's (T-246; see noPasswordOffer).
- runFlow:
    file: tap-and-see.yaml
    env:
      TAP_ID: login-submit
      GONE_ID: login-submit
      WAIT_MS: 10000
