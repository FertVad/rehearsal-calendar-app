# On the sign-in screen, filled in by sign-in-fill.yaml: sends it, and puts
# away iOS's offer to keep the password.
appId: ${APP_ID}
---
# A lost tap on "Sign In" left the form filled in and flow 59 waiting 30 s for
# a calendar that was never asked for (T-225), so it goes through
# tap-and-see.yaml too: the button leaves the screen when the app goes on to
# the calendar, or when iOS's sheet covers it all. Its label is in the
# language the screen speaks, so it is waited on by its id.
- runFlow:
    file: tap-and-see.yaml
    env:
      TAP_ID: login-submit
      GONE_ID: login-submit
      WAIT_MS: 10000
# iOS offers to keep the password, over the whole screen: while its sheet is
# up Maestro sees nothing of the app. A tap on "Not Now" the simulator lost
# left it there, and flow 51 waited 30 s for a calendar under it (T-213), so
# the tap goes through tap-and-see.yaml, which waits for the sheet to go.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    file: tap-and-see.yaml
    env:
      TAP: "Not Now"
      GONE: "Not Now"
      WAIT_MS: 5000
