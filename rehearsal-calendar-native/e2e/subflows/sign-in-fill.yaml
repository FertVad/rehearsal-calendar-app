# On the sign-in screen, already open: fills in ${EMAIL} and the password, and
# does not send them — sign-in-submit.yaml does. sign-in-form.yaml runs both; a
# flow that must do something between them runs them itself: a hold on what
# the sign-in asks for goes on after the typing, whose time no flow knows
# (flow 42, T-234).
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 60000
# The first keyboard after a cold launch is slow to come up, and text typed
# before it is there goes nowhere; the inputs do not report focus to wait on.
# So: type, check it landed — the password by its number of dots — and try
# again if not.
#
# The form opens empty, so only a try after the first erases what the one
# before left: eraseText takes about three seconds a field, and with a sign-in
# in every flow it cost the full run three minutes of its 45.
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-email
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${EMAIL}
      - assertVisible:
          id: login-email
          text: ${EMAIL}
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-password
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${PASSWORD}
      - assertVisible:
          id: login-password
          text: ${'•'.repeat(PASSWORD.length)}
