# On the sign-in screen, already open: signs in as ${EMAIL}. sign-in.yaml
# launches the app first; a flow that has to do something before signing in —
# open a link — launches it itself and runs this.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 60000
# The first keyboard after a cold launch is slow to come up, and text typed
# before it is there goes nowhere; the inputs do not report focus to wait on.
# So: type, check it landed — the password by its number of dots — and try
# again if not.
#
# The form opens empty, so only a try after the first erases what the one
# before left: eraseText takes about three seconds a field, and with a sign-in
# in every flow it cost the full run three minutes of its 45.
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-email
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${EMAIL}
      - assertVisible:
          id: login-email
          text: ${EMAIL}
- evalScript: ${output.signInTries = 0}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: login-password
      - waitForAnimationToEnd:
          timeout: 3000
      - evalScript: ${output.signInTries += 1}
      - runFlow:
          when:
            true: ${output.signInTries > 1}
          commands:
            - eraseText
      - inputText: ${PASSWORD}
      - assertVisible:
          id: login-password
          text: ${'•'.repeat(PASSWORD.length)}
# A lost tap on "Sign In" left the form filled in and flow 59 waiting 30 s for
# a calendar that was never asked for (T-225), so it goes through
# tap-and-see.yaml too: the button leaves the screen when the app goes on to
# the calendar, or when iOS's sheet covers it all. Its label is in the
# language the screen speaks, so it is waited on by its id.
- runFlow:
    file: tap-and-see.yaml
    env:
      TAP_ID: login-submit
      GONE_ID: login-submit
      WAIT_MS: 10000
# iOS offers to keep the password, over the whole screen: while its sheet is
# up Maestro sees nothing of the app. A tap on "Not Now" the simulator lost
# left it there, and flow 51 waited 30 s for a calendar under it (T-213), so
# the tap goes through tap-and-see.yaml, which waits for the sheet to go.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    file: tap-and-see.yaml
    env:
      TAP: "Not Now"
      GONE: "Not Now"
      WAIT_MS: 5000
