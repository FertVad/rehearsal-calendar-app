# On the sign-in screen, already open: signs in as ${EMAIL}. sign-in.yaml
# launches the app first; a flow that has to do something before signing in —
# open a link — launches it itself and runs this. A flow that has to do
# something between the typing and the tap runs its two halves itself.
appId: ${APP_ID}
---
- runFlow:
    file: sign-in-fill.yaml
    env:
      EMAIL: ${EMAIL}
- runFlow:
    file: sign-in-submit.yaml
