name: Rehearsal reminders

# Pings the endpoint that sends rehearsal reminders. The app runs on Vercel's
# Hobby plan, where a `crons` entry may fire once a day at most — and an entry
# asking for more fails the whole deployment — so the trigger has to live
# outside Vercel.
#
# GitHub's scheduler is not punctual: runs drift by 5–20 minutes under load and
# are skipped outright at busy times, and scheduled workflows are disabled after
# 60 days without repository activity. This is therefore the BACKUP — the
# primary is a cron-job.org job on the same URL and the same 15 minutes.
#
# Both running at once is deliberate and safe: every send is claimed in
# native_push_reminders (unique on rehearsal_id, reminder_type) before the push
# goes out, so whichever scheduler arrives second sends nothing.
#
# Requires one repository secret: CRON_SECRET, the same value as in Vercel.
# Settings → Secrets and variables → Actions → New repository secret.
#
# ---------------------------------------------------------------------------
# SUSPENDED 2026-09-12. NO REMINDERS ARE BEING SENT BY ANYTHING RIGHT NOW.
#
# The Neon database is on the free plan, which bills the time its compute is
# awake and puts it back to sleep after about five minutes idle. A ping every
# fifteen minutes therefore kept it awake roughly a third of every day, and two
# schedulers on that interval — this one and cron-job.org — consumed the whole
# 100 CU-hour monthly allowance on their own, almost always to be told there is
# nothing to send. The cron-job.org job was switched off the same day.
#
# To bring reminders back, uncomment the schedule below. Half-hourly is enough:
# the hour-before window is 0–1h and the day-before window 12–24h, so a check
# every thirty minutes still catches every rehearsal inside its window. Leave
# this backup at a couple of hours if the primary is running again — the claim
# in native_push_reminders is what makes overlapping schedulers safe, so the
# backup does not need to match the primary's cadence to be useful.
# ---------------------------------------------------------------------------

on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch: # so it can be fired by hand to check it works

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set — add it in Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Body and status are captured separately so a failure shows what the
          # server actually said, rather than just a number.
          body=$(mktemp)
          http_status=$(curl -sS --max-time 60 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://rehearsly.me/api/cron/reminders)

          echo "HTTP $http_status"
          cat "$body"
          echo

          if [ "$http_status" != "200" ]; then
            echo "::error::Reminder check failed with HTTP $http_status"
            exit 1
          fi
