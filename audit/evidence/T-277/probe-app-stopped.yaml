# T-277 probe: probe-app-left-running.yaml with the fix of flows 70 and 98 -
# the app is stopped before Safari is opened.
appId: com.apple.mobilesafari
name: T-277 probe - Safari opened with the app stopped
---
- repeat:
    times: 8
    commands:
      - launchApp:
          appId: ${APP_ID}
          stopApp: false
      - extendedWaitUntil:
          visible: ".+"
          timeout: 10000
      - stopApp: ${APP_ID}
      - stopApp
      - openLink:
          link: ${API_URL.replace('/api', '')}/invite/${TWELFTH_INVITE}?lang=en
      - extendedWaitUntil:
          visible: ".*Rehearsly.*"
          timeout: 30000
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"
      - extendedWaitUntil:
          visible: "Open in the App Store"
          timeout: 15000
      - assertVisible: "Install Rehearsly from the App Store."
