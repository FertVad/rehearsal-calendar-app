- runFlow:
    file: planner-partial.yaml
- runFlow:
    file: ../../../../rehearsal-calendar-native/e2e/subflows/tap-and-see.yaml
    env:
      TAP_ID: members-toggle-all
      SEE: "Nothing of the kind"
      WAIT_MS: 3000
