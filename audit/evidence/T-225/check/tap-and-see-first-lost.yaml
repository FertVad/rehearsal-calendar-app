# Generated by audit/evidence/T-225/make-checks.mjs - do not edit.
# A tap whose result the flow waits for, taken once more if the simulator lost
# it (T-207). The simulator drops about one tap in 250 - backboardd registers
# XCTest's digitizer for that tap twice and cancels the touch - and Maestro
# reports every tap done, so the flow would wait for a result that never comes
# (docs/e2e.md, "A lost tap").
#
#   env: TAP_ID (an id) or TAP (a text, regex) - what to tap
#        SEE     - a text (regex) the tap brings on screen, or
#        GONE    - a text (regex) the tap takes off it (T-213: "Not Now" of
#                  iOS's "Save Password?" sheet, which hides the whole app), or
#        GONE_ID - an id the tap takes off it (T-225: "login-submit", whose
#                  label is in whichever language the sign-in screen speaks)
#        WAIT_MS - how long the flow already waited for it
#
# Tap, wait for SEE (or for GONE / GONE_ID to go); if it has not, say so to the
# run (e2e/scripts/tap-again.js, printed after the flows) and tap once more -
# never more - and wait again, and then it must. Only for a tap that can be
# taken twice without harm: the second comes only when the first left no trace
# on screen.
appId: ${APP_ID}
---
# Asked as "is it there" for SEE and "is it gone" for GONE, the answer a tap
# that worked gives at once: notVisible waits seven seconds for a text to
# leave, so every SEE that came paid them, and a SEE that leaves of itself
# within them was tapped a second time.
- evalScript: ${output.tapSeen = false}
- runFlow:
    when:
      true: ${typeof SEE !== 'undefined'}
    commands:
      - extendedWaitUntil:
          visible: ${SEE}
          timeout: ${WAIT_MS}
          optional: true
      - runFlow:
          when:
            visible: ${SEE}
          commands:
            - evalScript: ${output.tapSeen = true}
- runFlow:
    when:
      true: ${typeof GONE !== 'undefined'}
    commands:
      - extendedWaitUntil:
          notVisible: ${GONE}
          timeout: ${WAIT_MS}
          optional: true
      - runFlow:
          when:
            notVisible: ${GONE}
          commands:
            - evalScript: ${output.tapSeen = true}
- runFlow:
    when:
      true: ${typeof GONE_ID !== 'undefined'}
    commands:
      - extendedWaitUntil:
          notVisible:
            id: ${GONE_ID}
          timeout: ${WAIT_MS}
          optional: true
      - runFlow:
          when:
            notVisible:
              id: ${GONE_ID}
          commands:
            - evalScript: ${output.tapSeen = true}
- runFlow:
    when:
      true: ${!output.tapSeen}
    commands:
      - runScript:
          file: ../../../../rehearsal-calendar-native/e2e/scripts/tap-again.js
          env:
            MAIL_URL: ${MAIL_URL}
            TAP: "${typeof TAP_ID !== 'undefined' ? 'id ' + TAP_ID : TAP}"
            SEE: "${typeof SEE !== 'undefined' ? SEE : (typeof GONE !== 'undefined' ? GONE : 'id ' + GONE_ID) + ' gone'}"
      - runFlow:
          when:
            true: ${typeof TAP_ID !== 'undefined'}
          commands:
            - tapOn:
                id: ${TAP_ID}
      - runFlow:
          when:
            true: ${typeof TAP_ID === 'undefined'}
          commands:
            - tapOn: ${TAP}
- runFlow:
    when:
      true: ${typeof SEE !== 'undefined'}
    commands:
      - extendedWaitUntil:
          visible: ${SEE}
          timeout: ${WAIT_MS}
# A GONE already seen gone is not asked again: each notVisible costs a second,
# and every sign-in pays it.
- runFlow:
    when:
      true: ${typeof GONE !== 'undefined' && !output.tapSeen}
    commands:
      - extendedWaitUntil:
          notVisible: ${GONE}
          timeout: ${WAIT_MS}
- runFlow:
    when:
      true: ${typeof GONE_ID !== 'undefined' && !output.tapSeen}
    commands:
      - extendedWaitUntil:
          notVisible:
            id: ${GONE_ID}
          timeout: ${WAIT_MS}
