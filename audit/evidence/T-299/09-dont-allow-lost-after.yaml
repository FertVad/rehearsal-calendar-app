# T-299 check, after: 09-dont-allow-lost.yaml with the onFlowComplete flows 09
# and 60 now have. It still fails - the tap is left out - but the prompt is
# refused when it ends, so flows 100 and 65 run after it on a clean screen.
appId: ${APP_ID}
name: T-299 check, the Don't Allow tap lost, the prompt not left
tags:
  - onboarding
  - calendar
onFlowComplete:
  - runFlow:
      file: ../../../rehearsal-calendar-native/e2e/subflows/no-calendar-prompt-left.yaml
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
- runFlow:
    file: ../../../rehearsal-calendar-native/e2e/subflows/sign-in-form.yaml
    env:
      EMAIL: ${NEWCOMER_EMAIL}
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- runFlow:
    file: ../../../rehearsal-calendar-native/e2e/subflows/tap-and-see.yaml
    env:
      TAP: "Get Started"
      SEE: "Your availability"
      WAIT_MS: 10000
- tapOn: "Grant Access"
- extendedWaitUntil:
    visible: "Don’t Allow|Don't Allow"
    timeout: 10000
# The tap on "Don't Allow" is lost here.
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
