# T-255 probe, not a flow: flow 10's opening - sign-in.yaml (a fresh launch,
# sign-in through tap-and-see), then the "+" and "Mark Busy" looked for - five
# times. Run from e2e/flows as 10-probe-tab-create.yaml, then removed.
# Output: probes.txt.
appId: ${APP_ID}
name: T-255 probe - Mark Busy after sign-in
---
- evalScript: ${output.misses = 0}
- evalScript: ${output.tries = 0}
- repeat:
    times: 5
    commands:
      - runFlow:
          file: ../subflows/sign-in.yaml
          env:
            EMAIL: ${TREPLEV_EMAIL}
      - evalScript: ${output.tries += 1}
      - tapOn:
          id: tab-create
      - extendedWaitUntil:
          visible: "Mark Busy"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible: "Mark Busy"
          commands:
            - evalScript: ${output.misses += 1}
            - evalScript: "${console.log('T-255 probe: no Mark Busy at try ' + output.tries)}"
            - takeScreenshot: probe-no-mark-busy
      - evalScript: "${console.log('T-255 probe: try ' + output.tries + ', misses ' + output.misses)}"
- runFlow:
    when:
      true: ${output.misses > 0}
    commands:
      - assertVisible: "T-255 probe missed Mark Busy"
